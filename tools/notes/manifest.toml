outline = [
  "1. Organisation, Composition & Appointment of Judges (Part V, Articles 124–128) :: Integrated single judicial hierarchy (inaugurated 28 Jan 1950 succeeding Federal Court 1937 & Privy Council) | Strength: Original 8 (1+7) → currently **34 (1 CJI + 33 Judges)** via Parliament's 2019 Act (NOT Constitution!) | Appointment & Collegium Evolution: *First Judges Case* (*S.P. Gupta* 1981 — 'consultation' ≠ concurrence), *Second Judges Case* (1993 — primacy of CJI + 2 senior-most), *Third Judges Case* (1998 — CJI + 4 senior-most collegium), *Fourth Judges Case / NJAC* (2015 — 99th Amend & NJAC Act struck down as violating judicial independence) | Qualifications (Art. 124(3): Citizen + 5 yrs HC Judge OR 10 yrs HC Advocate OR Distinguished Jurist — NO minimum age!), Oath, Tenure (65 yrs), Acting CJI (Art. 126), Ad-hoc Judges (Art. 127), Retired Judges (Art. 128), Seat of SC (Art. 130 — Delhi or other places by CJI with Presidential approval)",
  "2. Removal (Impeachment) & Independence of the Supreme Court :: Removal procedure (Art. 124(4) & Judges Enquiry Act 1968): 2 grounds ONLY ('proved misbehaviour' or 'incapacity'); 100 LS or 50 RS MPs motion → Speaker/Chairman admits/refuses → 3-member inquiry committee (SC Judge + HC CJ + distinguished jurist) → Special Majority in EACH House in the same session → Presidential order (no SC judge ever removed; Justice V. Ramaswami 1993 failed vote) | Eight Pillars of Independence (mode of appointment, security of tenure, fixed conditions charged on CFI, non-discussable conduct Art. 121, post-retirement practice ban Art. 124(7), contempt power Art. 129, own staff Art. 146, jurisdiction cannot be curtailed, separation from executive Art. 50)",
  "3. Complete Jurisdiction & Powers of the Supreme Court (Articles 129–145) :: Original Jurisdiction (Art. 131 — exclusive federal disputes; exclusions: pre-constitutional treaties, Art. 262 water disputes, Finance Commission, commercial disputes) | Writ Jurisdiction (Art. 32 — original, NOT exclusive; FRs only) | Appellate Jurisdiction: Constitutional (Art. 132), Civil (Art. 133), Criminal (Art. 134), Certificate for Appeal (Art. 134A) | Special Leave Petition (Art. 136 — discretionary, against any court/tribunal EXCEPT military tribunals) | Advisory Jurisdiction (Art. 143 — 2 categories: public importance [may decline] vs pre-constitutional treaty [must answer]; opinion NOT binding) | Court of Record (Art. 129 — evidentiary value & contempt of court), Review (Art. 137) & Curative Petition (*Rupa Ashok Hurra* 2002) | Law Declared Binding (Art. 141) & Complete Justice (Art. 142 — broad equity power + *Shilpa Sailesh* 2023 divorce, Chandigarh Mayor poll 2024) | Advocates (Senior Advocates, Advocates-on-Record, Other Advocates)",
  "4. Separation of Powers & Checks and Balances :: Montesquieu's doctrine (*The Spirit of Laws* 1748) vs India's functional overlap & checks and balances (Arts. 50, 53, 75, 105, 121–122, 123, 361; *Ram Jawaya Kapur* 1955, *Indira Nehru Gandhi* 1975 — basic structure) | Strict US Separation vs Indian Fusion with Judicial Check | Parliamentary Sovereignty (UK) vs Judicial Supremacy (USA) vs Indian Synthesis",
  "5. Judicial Review, Judicial Activism, Overreach & PIL :: Judicial Review: Constitutional basis (Arts. 13, 32, 131–136, 143, 226, 245–246, 251, 254, 372), *Minerva Mills* & *L. Chandra Kumar* (basic structure), 3 categories (constitutional amendments, legislation, administrative action) | Judicial Activism (origins in 1970s — Justices V.R. Krishna Iyer, P.N. Bhagwati, O. Chinnappa Reddy, D.A. Desai; substantive due process & positive rights) vs Judicial Restraint vs Judicial Overreach (liquor ban on highways, Jolly LLB/cinema anthem, BCCI administration, policy substitution) | Public Interest Litigation (PIL / Social Action Litigation): Relaxation of *locus standi*, epistolary jurisdiction (*Hussainara Khatoon* 1979, *S.P. Gupta* 1981, *Vishaka* 1997), guidelines against frivolous PILs & Mains Way Forward (Collegium reform, MoP, live-streaming, Master of the Roster, post-retirement cooling-off)",
]

