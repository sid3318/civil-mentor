  "2. Union Council of Ministers (Articles 74, 75, 77, 78, 88) :: Constitutional provisions: Art. 74 (aid & advice non-inquirable by courts), Art. 75 (appointment, 91st Amendment 2003 15% cap including PM, Tenth Schedule disqualification bar on ministership, 6-month membership rule) | Collective Responsibility (Art. 75(3) — 'swim or sink together' to Lok Sabha) vs Individual Responsibility (Art. 75(2) — President's pleasure / PM's control) vs No Legal Responsibility (unlike UK countersignature) | Three-tier composition: Cabinet Ministers, Ministers of State (Independent Charge / Attached), Deputy Ministers + Parliamentary Secretaries | Council of Ministers vs Cabinet (44th Amendment inserted 'Cabinet' in Art. 352(3) ONLY!) | Kitchen Cabinet / Inner Cabinet phenomenon",
  "3. Cabinet Committees :: Extra-constitutional (Rules of Business under Art. 77(3)); Standing vs Ad-hoc; 3–8 members (non-Cabinet ministers can be included); PM chairs most (except Parliamentary Affairs & Accommodation) | Complete profile of all 8 Standing Cabinet Committees (Political Affairs — 'Super-Cabinet', Economic Affairs, Appointments, Security, Parliamentary Affairs, Accommodation, Investment & Growth, Employment & Skill Development) | GoMs (Groups of Ministers) & EGoMs",
  "4. Central Administration: PMO, Cabinet Secretariat & Ministries :: Prime Minister's Office (PMO — extra-constitutional staff agency headed by Principal Secretary; evolution since 1947 & centralisation debates) | Cabinet Secretariat (Rules of Business 1961; headed by Cabinet Secretary — senior-most civil servant & ex-officio Chairman of Civil Services Board; coordination & crisis management) | Central Secretariat, Ministries & Departments (Transaction of Business & Allocation of Business Rules 1961; Secretary as administrative head; Attached vs Subordinate offices) | Second ARC recommendations on right-sizing ministries, domain expertise & lateral entry",
]

