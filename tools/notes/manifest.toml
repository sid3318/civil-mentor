# Every Civil Mentor note, in the order they get written. One set of notes serves
# Prelims and Mains together, filed by subject.
#
# [subjects] names each subject folder, in the order the subject books come in.
# One [[note]] per file under content/notes/: its id is `file` with / as - and no
# .md (polity/emergency.md is polity-emergency). `topics` are the syllabus nodes
# it covers, Prelims and Mains: every topic in the syllabus belongs to a note, and
# `notes.py check` proves it. `chunk` is the batch it is written in. Guides
# (`kind = "guide"`) teach a method rather than a subject. The app files each
# note under its subject and `section` (a note with none sits under the subject
# itself), in the order of this file. Titles, sections, topics, chunks and the
# order can change, and `notes.py run` or `check` passes the change on to
# written notes; a file name can change only before its note exists.

[subjects]
polity = "Polity"
economy = "Economy"
modern-india = "Modern India"
geography = "Geography"
environment = "Environment"
disaster = "Disaster management"
ancient-india = "Ancient India"
medieval-india = "Medieval India"
art-culture = "Art and culture"
science-tech = "Science and technology"
governance = "Governance"
social-justice = "Social justice"
ir = "International relations"
security = "Internal security"
society = "Indian society"
world-history = "World history"
ethics = "Ethics"
current-affairs = "Current affairs"
essay = "Essay"
language = "Language papers"
csat = "CSAT"

