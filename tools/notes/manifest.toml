  "2. Powers of the Governor & Comparison with the President :: Executive (Art. 166, appoints CM, Ministers, Advocate General, SEC, SPSC Chairman/Members — cannot remove SPSC members!, Tribal Welfare Minister in CG/JH/MP/OD — 94th Amend 2006, Chancellor of State Universities) | Legislative (summons/prorogues/dissolves Assembly, nominates 1/6th MLCs from 5 fields including **cooperative movement**, decides MLA disqualifications with ECI) | Financial & Judicial (Art. 161 Pardoning Power — CANNOT pardon death sentence or Court Martial, though can commute/remit/suspend death sentence!) | Ordinance-Making Power (Art. 213 — 3 cases requiring Presidential instructions) | Assent & Reservation of Bills (Articles 200 & 201): Four options (assent, withhold, return once — not Money Bill, reserve for President — mandatory when endangering High Court position); Recent landmark Supreme Court judgments (*State of Punjab v. Principal Secretary to Governor* 2023; *State of Tamil Nadu v. Governor of Tamil Nadu* April 2025 — 'as soon as possible', no pocket veto, timelines/deemed assent debates & 2025 Presidential Reference under Art. 143)",
