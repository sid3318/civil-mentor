outline = [
  "1. Constitutional Framework of Elections (Part XV, Articles 324–329) :: Single ECI (Art. 324), One General Electoral Roll & no religion/race/caste/sex exclusion (Art. 325), Universal Adult Suffrage >=18 yrs (Art. 326 — 61st Amend 1988), Parliament's & States' legislative power (Arts. 327–328), Bar on judicial interference in delimitation & electoral process (Art. 329 — only Election Petition to High Court post-election!) | Right to Vote: Constitutional/Statutory right Debate (*Jyoti Basu*, *PUCL* 2003, *Anoop Baranwal* 2023)",
  "2. Representation of the People Acts: RPA 1950 vs RPA 1951 :: **RPA 1950** (pre-election architecture: allocation of seats in LS/Assemblies/Councils, delimitation, Chief Electoral Officer, District Election Officer, Electoral Registration Officer, voter qualifications & preparation/revision of electoral rolls, 4 qualifying dates via 2021 Amendment + voluntary Aadhaar linking) | **RPA 1951** (actual conduct of elections: Returning Officer, qualifications & disqualifications — Sections 8, 8A, 9, 9A, 10, 10A; notification, nomination, deposits, campaigning, polling, counting; **Section 29A** party registration; **Section 123 Corrupt Practices** — bribery, undue influence, religious/caste appeals [*Abhiram Singh* 2017], booth capturing, freebies [*S. Subramaniam Balaji* 2013]; Election Petitions to High Court within 45 days; Paid News & Expenditure ceilings) | Clear RPA 1950 vs RPA 1951 comparison",
