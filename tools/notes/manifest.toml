outline = [
  "1. Evolution of Panchayati Raj & Reform Committees (1957–1992) :: Lord Ripon's Resolution (1882 — Magna Carta of Local Self-Government), Gandhi's Gram Swaraj & Article 40 | Community Development Programme (1952) & National Extension Service (1953) | Complete Committee Chronology: Balwantrai Mehta (1957 — 3-tier, democratic decentralisation; Nagaur, Rajasthan 2 Oct 1959 & Andhra Pradesh), Ashok Mehta (1977 — 2-tier Zila Parishad + Mandal Panchayat, political party participation, Nyaya Panchayats), G.V.K. Rao (1985 — 'grass without roots', DDC), L.M. Singhvi (1986 — constitutional recognition & Gram Sabha), Thungon (1988) & Gadgil (1988) | Legislative journey: 64th Bill (Rajiv Gandhi 1989) → 73rd & 74th Constitutional Amendment Acts (1992; effective 24 April 1993 & 1 June 1993)",
  "2. 73rd Amendment Act, 1992 — Panchayats (Part IX, Articles 243–243O & 11th Schedule) :: Gram Sabha (Art. 243A — all registered voters in village) | Three-Tier System (Art. 243B — intermediate tier optional for states <20 lakh population) | Elections (Art. 243C — direct for all members; chairpersons at intermediate/district indirect, village as state decides), Reservation (Art. 243D — SC/ST by population, **min 1/3rd Women** including within SC/ST — 20+ states raised to 50%; OBC voluntary), Duration (Art. 243E — 5 yrs, 6-month fresh election on dissolution for remainder term), Disqualifications (Art. 243F — minimum age **21 yrs**) | State Election Commission (Art. 243K — independent, removed like HC Judge) & State Finance Commission (Art. 243I — every 5 yrs) | Exhaustive **Compulsory vs Voluntary Provisions** matrix | Eleventh Schedule (29 functional items) & Exempted Areas (Art. 243M — Nagaland, Meghalaya, Mizoram, 5th/6th Schedule areas, Manipur hills, Darjeeling Gorkha Hill Council)",
  "3. PESA Act, 1996 (Extension to Fifth Schedule Areas) :: Bhuria Committee (1995) & enactment across 10 Fifth Schedule states | Gram Sabha empowerment: safeguarding customs/resources, mandatory consultation before land acquisition/rehabilitation, ownership of Minor Forest Produce (MFP), control over minor minerals licensing, prevention of land alienation, regulating intoxicants, village markets & moneylending | Ground reality & implementation gaps (rules still pending/weak in several states, conflict with Forest/Mining laws)",
  "4. 74th Amendment Act, 1992 — Municipalities (Part IXA, Articles 243P–243ZG & 12th Schedule) :: Three types of constitutional municipalities (Art. 243Q): Nagar Panchayat (transitional), Municipal Council (smaller urban), Municipal Corporation (larger urban) + Wards Committees (cities >=3 lakh population, Art. 243S) | Reservation, 5-yr duration, 21-yr age, SEC & SFC parallels with Part IX | District Planning Committee (DPC — Art. 243ZD: 4/5th elected by District Panchayat & Municipal members) & Metropolitan Planning Committee (MPC — Art. 243ZE: areas >=10 lakh, 2/3rd elected) | Twelfth Schedule (18 functional items) & Art. 243ZG bar on courts | Eight types of Urban Local Governments in India (Municipal Corporation, Municipality, Notified Area Committee, Town Area Committee, Cantonment Board — Ministry of Defence, Township, Port Trust, Special Purpose Agency) | Central Council of Local Government (Art. 263, 1954)",
  "5. The 3Fs (Functions, Funds, Functionaries), Local Finances & Governance Reforms :: Unfunded mandates & Activity Mapping gaps across States | Finances: Own-Source Revenue (property tax under-collection ~0.15% of GDP vs 1–2% OECD, user charges), SFC delays & poor Action Taken Reports, Central Finance Commission (15th FC ₹4.36 lakh crore tied/untied local body grants + Million-Plus Cities Challenge Fund; 16th FC continuity), Municipal Bonds (Pune, Indore, Ahmedabad, Surat, Ghaziabad, Vadodara; AMRUT incentives) | Structural pathologies (bureaucratic dominance — Municipal Commissioner vs weak Mayor, proxy 'Sarpanch Pati', parallel parastatals/SPVs under Smart Cities, capacity deficit) | 2nd ARC (6th Report — *Local Governance*), Directly Elected Mayor debate & Mains Way Forward",
]

