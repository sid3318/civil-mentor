outline = [
  "1. Constitutional & Historical Architecture of Affirmative Action :: Substantive equality philosophy; Colonial roots (Shahu Maharaj 1902, Mysore Miller Committee 1921, Communal Award & Poona Pact 1932) | Complete Constitutional Map: Educational & Public Employment (Arts. 15(4)–(6), 16(4)–(4B), 16(6)), Political Reservation (Arts. 330, 332, 334, 330A, 332A, 243D, 243T), Efficiency of Administration (Art. 335 & 82nd Amendment 2000), Backward Classes Commissions & Lists (Arts. 340, 341, 342, 342A) & Welfare Directive (Art. 46)",
  "2. OBC Reservation, Creamy Layer & Landmark Reservation Case Law :: Kaka Kalelkar Commission (1953–55) & **Mandal Commission** (B.P. Mandal, 1979–80 — 27% OBC quota implemented 1990) | ***Indra Sawhney v. Union of India* (1992, 9-judge bench)**: 27% OBC upheld, 10% EWS (1991 executive order) struck down, **Creamy Layer** exclusion mandated (Ram Nandan Committee 1993 — currently ₹8 lakh income cap), **50% ceiling** rule (except extraordinary circumstances), bar on reservation in promotions (reversed for SC/ST via 77th Amend 1995 & 85th Amend 2001 consequential seniority; carry-forward via 81st Amend 2000) | ***M. Nagaraj* (2006)** (3 conditions: backwardness, inadequate representation, Art. 335 efficiency) → ***Jarnail Singh* (2018)** (dropped SC/ST backwardness data requirement, extended creamy layer principle discussion to SC/ST promotions) | **Justice G. Rohini Commission** (2017–2023) on Sub-categorisation of Central OBCs (2,633 castes; uneven benefit capture) | 102nd Amendment (2018), *Jaishri Laxmanrao Patil* (2021 Maratha quota >50% struck down) & 105th Amendment (2021 — restored States' SEBC lists)",
  "3. EWS Quota, SC/ST Sub-Classification & Contemporary Debates :: **103rd Amendment (2019)** (Arts. 15(6) & 16(6) — 10% EWS quota excluding SC/ST/OBC) & ***Janhit Abhiyan* (Nov 2022, 3–2)** (economic criteria valid, 50% cap flexible for non-SEBCs, exclusion of already-covered classes valid) | ***State of Punjab v. Davinder Singh* (1 Aug 2024, 7-judge 6–1)** — overruled *E.V. Chinnaiah* (2004), permitted **Sub-classification within SCs and STs** based on empirical data of *inter-se* backwardness; 4 judges endorsed exploring SC/ST creamy layer | Vertical (social: SC/ST/OBC/EWS) vs Horizontal (interlocking: Women, PwD 4% RPwD Act 2016, Ex-servicemen) Reservation (*Saurav Yadav* 2020 — meritorious reserved candidates migrate to open merit!) | Debates: Caste Census, Private Sector & Domicile Quotas (Haryana 75% struck down by P&H HC 2023), Merit vs Social Justice",
  "4. Official Language of the Union & States (Part XVII, Articles 343–351) :: Constituent Assembly Munshi–Ayyangar Formula (Hindi in Devanagari script + international form of Indian numerals; English for 15 yrs till 1965) | Official Languages Act 1963 (1967 amendment — indefinite continuation of English alongside Hindi; anti-Hindi agitations in Tamil Nadu 1965) | Language of the Union (Arts. 343–344: Official Language Commission 1955 B.G. Kher & Committee of Parliament on Official Language — 30 MPs: 20 LS + 10 RS) | Regional Languages (Arts. 345–347: State's choice NOT restricted to Eighth Schedule!, inter-state communication, President's directive for substantial linguistic minority) | Language of Judiciary & Texts of Laws (Arts. 348–349: **Supreme Court strictly in English** until Parliament provides otherwise; High Court proceedings may allow Hindi/State language with Governor+President consent — currently UP, Bihar, MP, Rajasthan — but **judgments/decrees stay English unless Parliament acts!**) | Special Directives (Arts. 350 redressal in any language, 350A mother-tongue primary instruction, 350B Linguistic Minorities Officer, 351 development of Hindi)",
  "5. Eighth Schedule, Classical Languages & Language Policy :: **Eighth Schedule**: Originally 14 languages → **22 languages** today (21st Amend 1967: Sindhi; 71st Amend 1992: Konkani, Manipuri, Nepali; 92nd Amend 2003: Bodo, Dogri, Maithili, Santhali; 96th Amend 2011: Oriya→Odia; English & Rajasthani NOT in 8th Schedule!) | **Classical Languages of India**: Criteria (high antiquity 1,500–2,000 yrs, valuable ancient literature, distinctness) & complete list of **11 Classical Languages** — original 6 (Tamil 2004, Sanskrit 2005, Kannada 2008, Telugu 2008, Malayalam 2013, Odia 2014) + **5 newly added in October 2024 (Marathi, Pali, Prakrit, Assamese, Bengali)**! | Three-Language Formula (Kothari Commission 1968, NPE 1986 & **NEP 2020** — mother tongue till Grade 5/8, no language imposed) & Linguistic Diversity as a federal asset",
]

