  "4. Electoral Reforms Committees & Major Proposals :: Pre-1996, 1996 & post-2000 implemented reforms (age 18, EVM, VVPAT, exit poll ban, proxy voting for armed forces, ceiling on 2 constituencies — s. 33(7), cap on ₹2,000 cash donations) | Key Committees: Tarkunde (1974), Dinesh Goswami (1990), Vohra (1993 — crime–politics nexus), Indrajit Gupta (1998 — partial state funding), Law Commission 170th (1999) & 255th (2015), 2nd ARC (4th Report) | Major Pending Debates: **One Nation, One Election** (Ram Nath Kovind Committee March 2024 & 129th Constitutional Amendment Bill 2024 — pros: governance continuity, cost savings vs cons: federalism, regional parties, premature dissolution), State Funding of Elections, Totaliser Machines, Remote/Migrant Voting (RVM), De-registration power for ECI, Paid News as corrupt practice & Independent ECI Secretariat",
