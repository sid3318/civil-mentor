outline = [
  "1. Election Commission of India (Part XV, Article 324) :: Single-member (1950–89) to permanent 3-member body (1993: CEC + 2 ECs, equal powers & salary — *T.N. Seshan* 1995) | Appointment Transformation: *Anoop Baranwal v. UoI* (March 2023 — PM + LoP + CJI interim panel) → **Chief Election Commissioner and Other Election Commissioners (Appointment, Conditions of Service and Term of Office) Act 2023** (PM + Union Cabinet Minister + LoP LS; Search Committee; Cabinet Secretary salary parity; immunity clause; pending SC challenge) | Tenure (6 yrs / 65 yrs), Removal (CEC like SC Judge; ECs ONLY on CEC's recommendation — vulnerability debate!), No constitutional qualification or post-retirement bar! | Administrative, Advisory (Arts. 103 & 192 disqualifications) & Quasi-Judicial Powers (symbols, recognition, MCC) | Scope: Parliament, State Legislatures, President & VP (NOT Panchayats/Municipalities — State ECs!)",
  "2. Public Service Commissions: UPSC, SPSC & JSPSC (Part XIV, Articles 315–323) :: Composition (Chairman + Members fixed by President/Governor; **half must have 10+ yrs Govt service** — only qualification!) | Tenure (UPSC 6/65 yrs; SPSC & JSPSC 6/62 yrs — 41st Amend 1976) | Removal (ONLY by **President** for ALL THREE — UPSC, SPSC & JSPSC! Misbehaviour requires mandatory binding SC inquiry under Art. 317; insolvency/paid employment/infirmity directly by President) | Strict Post-Retirement Re-employment Matrix (UPSC Chair: none; UPSC Member: UPSC/SPSC Chair; SPSC Chair: UPSC Chair/Member or other SPSC Chair; SPSC Member: UPSC or SPSC Chair) | Advisory Functions (recruitment, disciplinary matters, promotions; NOT consulted on reservation/SC-ST claims; non-binding advice laid before Legislature with reasons) | JSPSC is **Statutory** (created by Parliament on request of 2+ State Legislatures — NOT constitutional!)",
  "3. Comptroller and Auditor General of India (Part V, Articles 148–151) :: 'Guardian of the Public Purse' (Ambedkar — 'most important officer under the Constitution'); Single office for both Union & States | Appointment (President by warrant), Tenure (6 yrs / 65 yrs), Removal (like SC Judge), Strict bar on further office under Union or State Govt, Expenses charged on CFI, No minister represents CAG in Parliament | Duties & Powers (Art. 149 & CAG DPC Act 1971): Audits Consolidated/Contingency/Public Accounts of Union & States, Govt companies (Companies Act), Grants bodies; **1976 separation of accounts from audit** at Centre (still compiles State accounts); Regulatory + Propriety + Performance Audit; submits 3 reports to President (Art. 151) examined by PAC | Contrast with UK CAG (India's CAG is purely *ex-post* Auditor, NOT Comptroller over exchequer issue!) | Contemporary issues (appointments reform, audit delays, PPP/local body audits)",
  "4. National Commissions for SCs, STs & BCs, and Linguistic Minorities (Articles 338, 338A, 338B & 350B) :: Historical evolution: Special Officer (1950) → Multi-member Commission (65th Amend 1990) → Bifurcation into **NCSC (Art. 338)** & **NCST (Art. 338A)** via **89th Amendment (2003)** → **NCBC (Art. 338B)** given constitutional status via **102nd Amendment (2018)** + **105th Amendment (2021)** restoring State power to maintain State SEBC lists (overriding *Jaishri Laxmanrao Patil* Maratha quota ruling) | Composition (Chairperson + Vice-Chairperson + 3 Members appointed by President; 3-yr term), Civil Court powers during investigation, Mandatory consultation on major policy matters, Annual reports laid before Parliament/State Legislatures | Special Officer for Linguistic Minorities (**Article 350B** — inserted by **7th Amendment 1956** on SRC recommendation; Commissioner headquartered at Prayagraj under Ministry of Minority Affairs; investigates Arts. 350/350A safeguards)",
  "5. Law Officers: Attorney General, Solicitor General & Advocate General (Articles 76, 88, 165, 177) :: **Attorney General of India (Art. 76)**: Highest law officer; qualified to be SC Judge; holds office during President's pleasure (no fixed term/removal); Right of audience in all Indian courts + right to speak & participate in Parliament/committees WITHOUT voting (Art. 88) + MP privileges (Art. 105); NOT a full-time Govt servant (allowed private practice, barred from defending criminal accused without permission or advising against GoI) | Solicitor General & Additional SGs (Statutory/Non-constitutional assistants — NOT mentioned in Art. 76!) | **Advocate General of the State (Art. 165)**: Highest state law officer; qualified to be HC Judge; Governor's pleasure; Art. 177 legislative participation | Master Comparative Matrix of All Constitutional Bodies (Articles, Appointment, Tenure, Removal, Post-Retirement Bar — plus cross-reference to Finance Commission Art. 280 & GST Council Art. 279A in Ch. 10)",
]

