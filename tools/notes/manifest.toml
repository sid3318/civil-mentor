  "4. The Chief Minister & State Council of Ministers (Articles 163–167, 177) :: Appointment of CM (Assembly majority, MLC can be CM, non-member for 6 months), Oath, Tenure & Powers (head of State CoM, Art. 167 duty to furnish information to Governor, State Planning, Vice-Chair of Zonal Council, ISC/NITI member) | State Council of Ministers (Art. 163 aid & advice + Governor's discretionary finality; Art. 164: 91st Amendment 2003 15% cap + minimum 12 ministers including CM; Delhi's 10% cap under Art. 239AA; Collective Responsibility to Legislative Assembly; Art. 177 ministerial & Advocate General rights in Legislature) | Complete PM vs CM & Union CoM vs State CoM comparison",
