[[note]]
chunk = 1
file = "polity/historical-background.md"
title = "1. Historical Background (1773–1947)"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 1 + Spectrum Constitutional Developments"
target_words = "8,000–10,000"
topics = [
  "mains.gs2.polity.constitution.history.company-rule",
  "pre.gs.polity.constitution.historical-background",
  "pre.gs.modern.administration.regulating-act",
  "pre.gs.modern.administration.charter-acts",
  "mains.gs1.modern-history.british-rule.administrative-structure-and-constitutional-acts",
  "mains.gs2.polity.constitution.history.crown-rule",
  "mains.gs2.polity.constitution.history.government-of-india-acts-1919",
  "mains.gs2.polity.constitution.history.indian-independence-act-1947",
  "pre.gs.modern.administration.government-of-india-act-1858",
  "pre.gs.modern.administration.morley-minto-reforms",
  "pre.gs.modern.administration.montagu-chelmsford-reforms",
  "pre.gs.modern.administration.government-of-india-act-1935",
  "mains.gs1.freedom-struggle.militant.morley-minto-reforms-and-communal",
  "mains.gs1.freedom-struggle.mass.montagu-chelmsford-reforms",
  "mains.gs1.freedom-struggle.mass.government-of-india-act-1935",
]
outline = [
  "1. Roots of British Constitutional Control (1600–1773) :: Charter of 1600 & East India Company's trading monopoly | Battle of Plassey (1757), Battle of Buxar (1764) & Grant of Diwani (1765) | Dual Government in Bengal (1765–1772) & financial crisis forcing Parliamentary intervention",
  "2. Company Rule — Early Parliamentary Statutes (1773–1813) :: Regulating Act of 1773 (Governor-General of Bengal, 4-member Executive Council, subordination of Bombay & Madras, Supreme Court at Calcutta 1774, Court of Directors) | Amending Act of 1781 / Act of Settlement (exempting Governor-General/Council & revenue matters from SC, personal law recognition) | Pitt's India Act of 1784 (Double Government: Court of Directors vs 6-member Board of Control, 'British possessions in India') | Act of 1786 (Lord Cornwallis's override & Commander-in-Chief demands) & Charter Act of 1793 (home government salaries from Indian revenues) | Charter Act of 1813 (end of EIC trade monopoly except tea & China, Christian missionaries, ₹1 lakh education grant, local taxation)",
  "3. Peak of Centralisation & Rise of Legislative Functions (1833–1853) :: Charter Act of 1833 (Governor-General of India — Lord William Bentinck, legislative centralisation, end of EIC commercial role, 4th Law Member Macaulay & First Law Commission, Section 87 merit principle, failed open ICS attempt) | Charter Act of 1853 (separation of legislative & executive functions, 6-member Indian/Central Legislative Council with local representation, Macaulay Committee 1854 & open ICS competition, indefinite Company trust)",
  "4. Crown Rule & Beginning of Representative Institutions (1858–1909) :: Revolt of 1857 & Queen's Proclamation (1 Nov 1858) | Government of India Act 1858 (Act for the Good Government of India, abolition of Double Government, Viceroy — Lord Canning, Secretary of State for India & 15-member Council of India) | Indian Councils Act 1861 (association of Indians in law-making, legislative devolution to Bombay & Madras, Portfolio System, Viceroy's ordinance power) | Indian Councils Act 1892 (expanded non-officials, indirect nomination/election principle, budget discussion & questions without supplementaries) | Indian Councils Act 1909 / Morley–Minto Reforms (enlarged councils, official vs non-official majority, supplementary questions & budget resolutions, Satyendra Prasad Sinha in Executive Council, separate electorates for Muslims & 'Father of Communal Electorate')",
  "5. Responsible Government, Dyarchy & Provincial Autonomy (1919–1935) :: Montagu Declaration (20 August 1917) & Government of India Act 1919 / Montagu–Chelmsford Reforms (Central vs Provincial Subjects, Provincial Dyarchy — Reserved vs Transferred, Bicameralism & direct elections at Centre, 3 of 6 Indian Executive Councillors, expanded communal electorates, High Commissioner for India, Central Public Service Commission 1926, separation of provincial & central budgets) | Simon Commission (1927–1930), Nehru Report (1928), Three Round Table Conferences (1930–1932), Communal Award (1932) & Poona Pact (1932) | Government of India Act 1935 (All-India Federation blueprint, 3 Lists & Viceroy's residuary powers, abolition of provincial dyarchy & Provincial Autonomy, Central Dyarchy, provincial bicameralism in 6 provinces, Federal Court 1937, RBI 1935, FPSC/PPSC/JPSC, Burma separation & franchise expansion)",
  "6. Constitutional Deadlock, Partition & Independence (1940–1947) :: August Offer (1940), Cripps Mission (1942), Rajagopalachari Formula & Wavell Plan / Shimla Conference (1945) | Cabinet Mission Plan (1946) (grouping of provinces, rejection of Pakistan, Constituent Assembly & Interim Government) | Attlee's Statement (20 Feb 1947) & Mountbatten Plan (3 June 1947) | Indian Independence Act 1947 (Dominions of India & Pakistan, sovereignty of Constituent Assemblies, lapse of British paramountcy over princely states, abolition of Secretary of State, Radcliffe Boundary Commission)",
  "7. Legacy of Colonial Statutes on the Indian Constitution :: Direct structural borrowings from GoI Act 1935 (Three Lists, Governor, Emergency, Judiciary, Public Service Commissions) | Transformative breaks in 1950 (universal adult suffrage, Fundamental Rights, abolition of separate electorates, republican sovereignty) | Mains analytical synthesis & UPSC PYQ traps",
]

[[note]]
chunk = 2
file = "polity/making-of-the-constitution.md"
title = "2. Making of the Constitution"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 2 + Constituent Assembly Debates & Interim Government"
target_words = "6,500–8,500"
topics = [
  "mains.gs2.polity.constitution.making",
  "pre.gs.polity.constitution.making-of-the-constitution",
  "mains.gs1.post-independence.nation-building.making-of-the-constitution",
]
outline = [
  "1. Evolution of the Demand for a Constituent Assembly :: M.N. Roy's pioneering proposal (1934) & INC official demand (1935) | Jawaharlal Nehru's 1938 declaration on adult franchise & freedom from outside interference | August Offer (1940), Cripps Proposals (1942) & acceptance via Cabinet Mission Plan (May 1946)",
  "2. Composition & Election of the Constituent Assembly :: Total strength 389 (296 British India: 292 Governors' Provinces + 4 Chief Commissioners' Provinces; 93 Princely States) | Population ratio (1 seat per million), community allocation (Muslims, Sikhs, General) & PR-STV indirect election by provincial MLAs | July–August 1946 election results (INC 208, Muslim League 73, others 15) & Princely States' initial abstention | Character: partly elected, partly nominated, indirectly elected, yet deeply representative across communities & women members (15 women including Hansa Mehta, Ammu Swaminathan, Dakshayani Velayudhan, Begum Aizaz Rasul)",
  "3. Working of the Assembly & the Objectives Resolution :: First meeting (9 Dec 1946, Muslim League boycott, 211 members), Dr Sachchidananda Sinha (temporary President) | Election of Dr Rajendra Prasad (President), H.C. Mukherjee & V.T. Krishnamachari (two Vice-Presidents) & Sir B.N. Rau (Constitutional Advisor) | Objectives Resolution (moved 13 Dec 1946 by Nehru; adopted unanimously 22 Jan 1947) — its 8 foundational principles & link to the Preamble | Changes after Indian Independence Act 1947 (fully sovereign body, dual role as Constituent Assembly & Dominion Legislature chaired by G.V. Mavalankar, strength reduced to 299: 229 Indian Provinces + 70 Princely States)",
  "4. Committees of the Constituent Assembly :: 8 Major Committees (Union Powers, Union Constitution, Provincial Constitution, Drafting, Advisory on FRs/Minorities/Tribal Areas + its 5 Sub-Committees, Rules of Procedure, States Committee, Steering Committee) | Key Minor Committees (Finance & Staff, Credentials, House, Order of Business, Ad-hoc National Flag, Functions of CA, Ad-hoc Supreme Court, Linguistic Provinces, Expert Committee on Financial Provisions, Press Gallery, Citizenship) | The Drafting Committee (29 Aug 1947): all 7 members (B.R. Ambedkar, N. Gopalaswami Ayyangar, Alladi Krishnaswami Ayyar, Dr K.M. Munshi, Syed Mohammad Saadullah, N. Madhava Rau replacing B.L. Mitter, T.T. Krishnamachari replacing D.P. Khaitan)",
  "5. Enactment, Enforcement & Key Milestones :: First Draft (Feb 1948), 8 months of public discussion, Second Draft (Oct 1948), Three Readings (Nov 1948 – Nov 1949), 7,653 amendments proposed & 2,473 discussed across 11 sessions (2 years, 11 months, 18 days; ₹64 lakh) | Adoption (26 Nov 1949 — 284 members signed; Preamble, 395 Articles, 8 Schedules) & immediate commencement of 16 Articles (citizenship, elections, provisional parliament, Art. 394) | Full commencement (26 Jan 1950 — Lahore Purna Swaraj 1930 connection), abolition of Privy Council Jurisdiction Act 1949 & repeal of GoI 1935 / IIA 1947 | Other functions performed (Commonwealth membership May 1949, National Flag 22 Jul 1947, National Anthem & Song 24 Jan 1950, First President Rajendra Prasad 24 Jan 1950) | Interim Government (1946) vs First Cabinet of Free India (1947) & Calligraphy/Artwork (Prem Behari Narain Raizada, Nandalal Bose, Beohar Rammanohar Sinha, Vasant Krishan Vaidya) | Expert Committee of the Congress (July 1946) & Hindi Text (Art. 394A, 58th Amendment)",
  "6. Criticism, Defence & Constitutional Philosophy :: Six standard criticisms (not representative, not sovereign, time-consuming — 'Drifting Committee', Congress-dominated — Granville Austin's reply, lawyer-politician domination, Hindu-dominated — Lord Viscount Simon & Churchill) | Granville Austin's 'seamless web' (unity, democracy, social revolution) & Ambedkar's closing warning (25 Nov 1949: 'grammar of anarchy', bhakti in politics, social & economic democracy) | Mains analytical framework",
]

[[note]]
chunk = 3
file = "polity/salient-features-preamble.md"
title = "3. Salient Features, Preamble, Parts & Schedules"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 3 & Ch. 4 + Appendices on Parts, Schedules & Sources"
target_words = "8,500–10,500"
topics = [
  "mains.gs2.polity.constitution.features.written-and-detailed-constitution",
  "mains.gs2.polity.constitution.features.blend-of-rigidity-and-flexibility",
  "mains.gs2.polity.constitution.features.secularism-adult-franchise-and-single",
  "mains.gs2.polity.constitution.preamble",
  "mains.gs2.polity.comparison.borrowed-features",
  "pre.gs.polity.constitution.salient-features-and-sources",
  "pre.gs.polity.constitution.preamble",
  "mains.gs2.polity.constitution.provisions.schedules-and-important-articles",
  "pre.gs.polity.constitution.schedules-of-the-constitution",
]
outline = [
  "1. Salient Features of the Indian Constitution :: Lengthiest written Constitution (geographical, historical GoI 1935, single Constitution for Centre & States, legal luminaries) | Drawn from various sources (structural, philosophical, political) | Blend of rigidity and flexibility (Art. 368 vs simple majority) | Federal system with unitary bias ('quasi-federal' — K.C. Wheare, 'bargaining' — Morris Jones, 'cooperative' — Granville Austin) | Parliamentary form of government (Westminster model + Indian adaptations) | Synthesis of parliamentary sovereignty & judicial supremacy | Integrated & independent judiciary | Fundamental Rights, DPSP & Fundamental Duties | Secular State (positive Indian secularism vs Western negative secularism) | Universal Adult Franchise (61st Amendment 1988: 21→18), Single Citizenship, Independent Constitutional Bodies, Emergency Provisions, Three-Tier Government (73rd/74th) & Co-operative Societies (97th)",
  "2. Sources & Borrowed Features (Structural Blueprint) :: Detailed mapping of GoI Act 1935, British, US, Irish, Canadian, Australian, Weimar (Germany), Soviet (USSR), French, South African & Japanese Constitutions | Answering the 'bag of borrowings' & 'carbon copy of 1935 Act' criticisms (Ambedkar's defence in the Constituent Assembly)",
  "3. Criticism of the Constitution :: Six classical critiques (borrowed Constitution, carbon copy of 1935 Act, un-Indian/anti-Indian, un-Gandhian, elephantine size, paradise of lawyers — Sir Ivor Jennings) & balanced rebuttal",
  "4. The Preamble: Text, Philosophy & Keywords :: Origin in Objectives Resolution & US precedent; exact text & 42nd Amendment Act 1976 (Socialist, Secular, Integrity) | Four ingredients (Source of authority, Nature of Indian State, Objectives, Date of adoption) | Deep analysis of every keyword: Sovereign, Socialist (democratic vs communistic, post-1991 shift), Secular (positive secularism, *S.R. Bommai* 1994), Democratic (direct vs indirect; political, social & economic democracy), Republic, Justice (Social, Economic, Political — Russian Revolution 1917), Liberty, Equality & Fraternity (French Revolution 1789; unity & integrity, dignity of individual)",
  "5. Legal Status, Amendability & Significance of the Preamble :: Is the Preamble part of the Constitution? (*Berubari Union* 1960 vs *Kesavananda Bharati* 1973 vs *LIC of India* 1995) | Two key limitations (neither a source of legislative power nor a prohibition; non-justiciable) | Amendability under Article 368 & basic structure constraint | Iconic tributes (N.A. Palkhivala, K.M. Munshi, Thakur Das Bhargava, Sir Ernest Barker, M. Hidayatullah)",
  "6. Parts of the Constitution (Parts I to XXII & Additions/Deletions) :: Complete architectural map of all 22 original / 25 current Parts (including repealed Part VII & added Parts IVA, IXA, IXB, XIVA) with Article ranges & thematic groupings",
  "7. The Twelve Schedules in Full Detail :: Exhaustive breakdown of Schedules 1 to 12: original 8 Schedules + 9th (1st Amend 1951 & *I.R. Coelho* 2007), 10th (52nd Amend 1985 & 91st Amend 2003), 11th (73rd Amend 1992 — 29 matters) & 12th (74th Amend 1992 — 18 matters) | Key Prelims traps (2nd Schedule exclusions, 3rd Schedule exclusions, 5th vs 6th Schedule states, 7th Schedule subject shifts via 42nd Amend, 8th Schedule language additions 21st/71st/92nd/96th) | Essential high-yield Articles reference guide",
]

[[note]]
chunk = 4
file = "polity/union-territory-citizenship.md"
title = "4. The Union and Its Territory, and Citizenship"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 5 & Ch. 6"
target_words = "8,000–10,000"
topics = [
  "mains.gs2.polity.constitution.provisions.citizenship",
  "pre.gs.polity.constitution.union-and-its-territory",
  "pre.gs.polity.constitution.citizenship",
]
outline = [
  "1. Union of States & Territorial Architecture (Articles 1–4) :: Article 1 ('India, that is Bharat, shall be a Union of States' — Ambedkar's two reasons: not a result of agreement, no right to secede; 'Union of India' vs 'Territory of India') | Article 2 (admission/establishment of new states not already part of India — e.g. Sikkim 35th & 36th Amendments) | Article 3 (internal readjustment — formation, area, boundaries, name; prior Presidential recommendation, state legislature's non-binding views, 'indestructible Union of destructible states' vs USA) | Article 4 (laws under Arts. 2 & 3 are NOT Article 368 amendments — simple majority, consequential First & Fourth Schedule edits)",
  "2. Cession of Territory & Border Settlements :: *Berubari Union* case (1960) — cession to a foreign state requires an Article 368 amendment (9th Amendment Act 1960) | *Ram Kishore Sen* / *Maganbhai Ishwarbhai Patel* (1969) — boundary dispute settlement without cession needs only executive action | 100th Constitutional Amendment Act (2015) — India–Bangladesh Land Boundary Agreement (111 enclaves transferred, 51 received, adverse possessions)",
  "3. Evolution & Reorganisation of States and Union Territories (1947–2026) :: Integration of 552 princely states (Sardar Patel & V.P. Menon; Hyderabad — Operation Polo, Junagadh — referendum, Kashmir — Instrument of Accession) | Four-fold classification (Parts A, B, C, D) in 1950 | Linguistic Provinces Commissions: S.K. Dhar Commission (1948), JVP Committee (1948–49), Potti Sriramulu & Andhra State (Oct 1953), Fazl Ali Commission (1953–55 — 4 criteria, rejecting 'one language-one state') | States Reorganisation Act 1956 & 7th Constitutional Amendment (14 States + 6 UTs) | Complete chronology of new States & UTs created since 1956 (Maharashtra/Gujarat 1960, Dadra & Nagar Haveli 1961, Goa/Daman & Diu 1962/1987, Puducherry 1962, Nagaland 1963, Haryana/Chandigarh/HP 1966/1971, Manipur/Tripura/Meghalaya 1972, Sikkim 1975, Mizoram/Arunachal 1987, Chhattisgarh/Uttarakhand/Jharkhand 2000, Telangana 2014, J&K & Ladakh 2019, DNH & DD merger 2020) & Name Changes | Mains debate: Smaller States vs Administrative Viability & Ongoing Statehood Demands (Ladakh, Vidarbha, Gorkhaland, Bodoland)",
  "4. Constitutional Provisions on Citizenship (Part II, Articles 5–11) :: Meaning & significance (citizens vs friendly/enemy aliens; rights & offices reserved exclusively for citizens) | Article 5 (domicile at commencement), Article 6 (migrants from Pakistan — 19 July 1948 permit cutoff), Article 7 (returnees from Pakistan after 1 March 1947), Article 8 (Persons of Indian Origin residing abroad) | Article 9 (voluntary acquisition of foreign citizenship ends Indian citizenship), Article 10 (continuance), Article 11 (plenary power of Parliament to regulate citizenship)",
  "5. Citizenship Act, 1955: Acquisition & Loss :: Five modes of acquisition (Birth — progressive tightening in 1986 & 2003; Descent; Registration — 7-year residence & categories; Naturalisation — 11/12 years, Eighth Schedule language, waiver for distinguished service; Incorporation of territory) | Three modes of loss (Renunciation; Termination; Deprivation — fraud, disloyalty, war trade, 2-year imprisonment within 5 yrs, 7 yrs continuous residence abroad) | Special Provisions for Assam: Section 6A (Assam Accord 1985 — 1 Jan 1966 & 25 Mar 1971 cutoffs) & 5-Judge Constitution Bench ruling in *In Re: Section 6A of the Citizenship Act* (Oct 2024, 4–1 majority upholding validity)",
  "6. CAA 2019, NRC, Single Citizenship & Diaspora Frameworks :: Citizenship (Amendment) Act 2019 & March 2024 Rules (6 non-Muslim persecuted communities from Pakistan, Bangladesh, Afghanistan entering on/before 31 Dec 2014; residence reduced 11→5 yrs; Sixth Schedule & Inner Line Permit exemptions; constitutional debates under Art. 14 & secularism) | National Register of Citizens (NRC) & National Population Register (NPR) — legal basis under 2003 Rules | Single Citizenship in India vs Dual Citizenship in USA/Switzerland + exceptions (Art. 16(3), Art. 15 residence, Art. 19(5) ST areas, J&K pre-2019) | NRI vs PIO (merged 2015) vs OCI (rights, restrictions, cancellation grounds & 2021 MHA notification)",
]

[[note]]
chunk = 5
file = "polity/fundamental-rights.md"
title = "5. Fundamental Rights (Articles 12–35)"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 7 + Supreme Court Constitutional Law Digest"
target_words = "14,000–17,000"
topics = [
  "mains.gs2.polity.constitution.provisions.fundamental-rights",
  "pre.gs.polity.rights.fundamental-rights.definition-of-state-laws-inconsistent",
  "pre.gs.polity.rights.fundamental-rights.right-to-equality",
  "pre.gs.polity.rights.fundamental-rights.right-to-freedom",
  "pre.gs.polity.rights.fundamental-rights.right-against-exploitation",
  "pre.gs.polity.rights.fundamental-rights.right-to-freedom-of-religion",
  "pre.gs.polity.rights.fundamental-rights.cultural-and-educational-rights",
  "pre.gs.polity.rights.fundamental-rights.right-to-constitutional-remedies",
  "pre.gs.polity.rights.writs",
]
outline = [
  "1. Nature, Origins & Salient Features of Fundamental Rights :: Magna Carta of India (Part III, Arts. 12–35); Nehru Report (1928), Karachi Resolution (1931), Kripalani Sub-Committee, US Bill of Rights influence | Removal of Right to Property (Art. 31 → Art. 300A via 44th Amendment 1978) & 6 remaining groups | Complete feature matrix: Citizens-only vs All Persons, State vs Private horizontal application (Arts. 15(2), 17, 23, 24), Negative vs Positive, Qualified not absolute, Justiciable, Suspendable (except Arts. 20–21), Self-executing vs Parliamentary laws",
  "2. Definition of 'State' (Article 12) & Judicial Review (Article 13) :: Four limbs of Article 12 & 'Other Authorities' evolution (*Rajasthan Electricity Board*, *R.D. Shetty* 1979, *Ajay Hasia* 1981, *Pradeep Kumar Biswas* 2002, *Zee Telefilms* 2005 — BCCI under Art. 226 not Art. 12, Judiciary as State debate — *Naresh Shridhar Mirajkar*) | Article 13: Pre- and Post-constitutional laws, broad definition of 'Law' (custom, ordinances, delegated legislation; personal law debate — *Narasu Appa Mali* vs *Shayara Bano*) | Doctrines of Severability, Eclipse (*Bhikaji Narain Dhakras* 1955), No Waiver (*Basheshar Nath* 1959) & Prospective Overruling | Article 13(4) (24th Amendment 1971) vs *Kesavananda Bharati* (1973)",
  "3. Right to Equality (Articles 14–18) :: Article 14: Equality before Law (British, Dicey's Rule of Law) vs Equal Protection of Laws (US); Reasonable Classification (*Anwar Ali Sarkar* 1952 — Intelligible Differentia + Rational Nexus); New Doctrine of Arbitrariness (*E.P. Royappa* 1974, *Maneka Gandhi* 1978, *Shayara Bano* 2017 manifest arbitrariness, *Navtej Johar* 2018, *Joseph Shine* 2018); Exceptions (Arts. 361, 361A, 105, 194, 31C, diplomats) | Article 15: Five prohibited grounds ('only'), Clause (2) horizontal access, Exceptions 15(3)–15(6) (1st, 93rd, 103rd Amendments; *Champakam Dorairajan*, *Ashoka Kumar Thakur*, *Pramati Trust*, *Janhit Abhiyan* 2022) | Article 16: Seven grounds (adds descent & residence), Clauses 16(3)–16(6) (77th, 81st, 85th, 103rd Amendments), *Indra Sawhney* (1992), *M. Nagaraj* (2006), *Jarnail Singh* (2018), *State of Punjab v. Davinder Singh* (Aug 2024, 6–1 SC/ST sub-classification) | Article 17: Abolition of Untouchability, Protection of Civil Rights Act 1955 & SC/ST (PoA) Act 1989 | Article 18: Abolition of Titles & *Balaji Raghavan* (1996) on National Awards",
  "4. Right to Freedom: The Six Freedoms (Article 19) :: Citizens only; six freedoms (originally seven — 19(1)(f) omitted by 44th Amend) | Speech & Expression 19(1)(a) & 8 grounds under 19(2) (1st & 16th Amendments; press freedom, *Romesh Thappar*, *Shreya Singhal* 2015 s. 66A, *Anuradha Bhasin* 2020 internet, *Kaushal Kishor* 2023 horizontal speech, sedition s. 124A / BNS s. 152, hate speech, Electoral Bonds *ADR* 2024 right to information) | Peaceful Assembly 19(1)(b) & 19(3) (s. 144 CrPC / BNSS s. 163, *Shaheen Bagh* 2020) | Associations, Unions & Co-operative Societies 19(1)(c) (97th Amend 2011) & 19(4) | Movement 19(1)(d) & Residence 19(1)(e) & 19(5) (protection of STs, Inner Line Permit) | Profession, Trade & Business 19(1)(g) & 19(6) (state monopoly, professional qualifications)",
  "5. Protection in Respect of Conviction, Life & Personal Liberty (Articles 20–22) :: Article 20 (Non-suspendable): No ex-post-facto criminal law, No double jeopardy (judicial proceedings only — not departmental), No self-incrimination (*Selvi v. State of Karnataka* 2010 — narco/polygraph/brain mapping vs fingerprints/DNA) | Article 21 (Non-suspendable): Paradigm shift from *A.K. Gopalan* (1950, narrow 'procedure established by law') to *Maneka Gandhi* (1978, Golden Triangle 14–19–21, substantive due process); Expanded basket of 35+ implied rights (*K.S. Puttaswamy* 2017 Privacy & 4-fold proportionality test, *Common Cause* 2018 passive euthanasia & living wills, *M.K. Ranjitsinh* 2024 climate change & clean environment, *Supriyo* 2023 marriage equality, livelihood, shelter, health, speedy trial, legal aid, solitary confinement, right to sleep/die) | Article 21A (86th Amendment 2002) & RTE Act 2009 | Article 22: Punitive Detention 22(1)–(2) (grounds, lawyer, 24-hour magistrate; exclusions: enemy aliens & preventive detainees) vs Preventive Detention 22(4)–(7) (3-month cap, Advisory Board, 44th Amend unnotified 2-month clause, Parliament vs State legislative competence, NSA/UAPA/COFEPOSA/PSA)",
  "6. Right against Exploitation (Articles 23–24) :: Article 23: Prohibition of traffic in human beings, begar & forced labour (against State & private persons; *PUDR v. UoI* 1982 — payment below minimum wage is forced labour; Bonded Labour System Abolition Act 1976, ITPA 1956; exception: compulsory public service without discrimination on religion/race/caste/class) | Article 24: Prohibition of child labour (<14 yrs in factories, mines, hazardous employment), Child & Adolescent Labour (Prohibition & Regulation) Amendment Act 2016 (total ban <14 except family enterprises/audio-visual; 14–18 adolescents banned from hazardous occupations), *M.C. Mehta* (1996) & NCPCR",
  "7. Right to Freedom of Religion (Articles 25–28) & Cultural-Educational Rights (Articles 29–30) :: Article 25: Freedom of conscience, profess, practise & propagate (subject to public order, morality, health & other Part III rights; *Rev. Stanislaus* 1977 conversion, Essential Religious Practices test — *Shirur Mutt* 1954 to *Sabarimala* 2018 & 9-judge reference, Sikhs' Kirpan & Hindu definition Explanation II) | Article 26: Collective religious denominational rights (*S.P. Mittal* 3-part test) | Article 27: Freedom from religious taxation (tax vs fee distinction) | Article 28: Four types of educational institutions & religious instruction | Article 29: Protection of distinct language, script or culture of 'any section of citizens' (includes majority too — *St. Xavier's* 1974) & non-discrimination in aided institutions | Article 30: Religious & linguistic minorities' right to establish & administer educational institutions (*T.M.A. Pai* 2002, *P.A. Inamdar* 2005, *Aligarh Muslim University v. Naresh Agarwal* Nov 2024 7-judge bench overruling *Azeez Basha* 1967 on minority status indicia)",
  "8. Constitutional Remedies, Writs, Armed Forces & Savings (Articles 32–35 & 31A–31C) :: Article 32 ('Heart and soul of the Constitution' — Ambedkar; basic feature; locus standi & PIL) | All Five Prerogative Writs in full depth: Habeas Corpus, Mandamus, Prohibition, Certiorari, Quo Warranto (when issued, against whom, exceptions) & SC (Art. 32) vs HC (Art. 226) comparison | Article 33 (Parliament alone restricts FRs of armed forces, paramilitary, police, intelligence & telecom personnel) | Article 34 (Martial Law & Act of Indemnity; Martial Law vs National Emergency comparison) | Article 35 (Exclusive Parliamentary legislative power for Arts. 16(3), 32(3), 33, 34, 17, 23) | Saving of Certain Laws: Article 31A (agrarian/estate reform), Article 31B & Ninth Schedule (1st Amend 1951; *I.R. Coelho* 2007 — 24 April 1973 cutoff & basic structure review), Article 31C (25th Amend 1971, *Kesavananda*, *Minerva Mills* 1980, & 9-judge Constitution Bench ruling in *Property Owners Association v. State of Maharashtra* Nov 2024 on Art. 39(b) 'material resources of the community' & Art. 31C survival) | Rights outside Part III (Arts. 265, 300A, 301, 326) | Criticism, Significance & Mains Answer Framework",
]

[[note]]
chunk = 6
file = "polity/dpsp-duties.md"
title = "6. Directive Principles of State Policy & Fundamental Duties"
section = "Part I: Constitutional Framework"
book_ref = "M. Laxmikanth Ch. 8 & Ch. 9"
