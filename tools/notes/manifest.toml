outline = [
  "1. Structure, Composition, Delimitation & Duration (Articles 79–83, 330–334A) :: Three organs (Art. 79: President + RS + LS) | Rajya Sabha (Art. 80: Max 250, Now 245 — 225 States, 8 UTs [J&K 4, Delhi 3, Puducherry 1], 12 Nominated from 4 fields; 4th Schedule population allocation vs US Senate; PR-STV open ballot & no domicile — *Kuldip Nayar* 2006; no NOTA — *Shailesh Parmar* 2018) | Lok Sabha (Art. 81: Max 550 after 104th Amend ended Anglo-Indian seats, Now 543 — 524 States + 19 UTs; FPTP & Art. 326; Delimitation Art. 82, 42nd/84th/87th Amendments 1971 freeze & post-2026 census; SC 84 & ST 47 seats; 106th Amendment *Nari Shakti Vandan Adhiniyam* 2023 Arts. 330A/332A/334A & 2026 updates; 129th ONOE Bill & 131st Bill 2026) | Duration (Art. 83: RS permanent, 6-yr term fixed by RPA 1951 s. 154 NOT Constitution; LS 5 yrs, Emergency extension)",
  "2. Membership: Qualifications, Disqualifications, Vacation & Oath (Articles 84, 88, 99, 101–104) :: Qualifications (Art. 84 & RPA 1951) | Disqualifications (Art. 102(1) Office of Profit — *Jaya Bachchan* 2006, RPA 1951 s. 8(3) 2-yr conviction & *Lily Thomas* 2013 immediate disqualification, decided by President bound by ECI Art. 103 vs Tenth Schedule decided by Presiding Officer) | Double membership & Vacation of seats (Art. 101: 10-day / 14-day rules, voluntary resignation 33rd Amend, 60-day absence) | Oath (Art. 99), ₹500/day penalty (Art. 104) & Ministerial/AG rights (Art. 88)",
  "3. Presiding Officers, Leaders, Whips & Secretariat (Articles 89–98) :: Speaker of Lok Sabha (Arts. 93–96: election, tenure beyond dissolution, party non-resignation trap, effective-majority removal & Art. 96 first-instance vote, powers — Money Bill certification, Joint Sitting, Tenth Schedule, casting vote Art. 100, independence & neutrality debates) | Deputy Speaker (not subordinate, automatic committee chair, vacancy since 2019), Panel of Chairpersons (absence ONLY, NOT vacancy!) & Speaker pro tem (Art. 95(1)) | Chairman (VP) & Deputy Chairman of RS (Arts. 89–92; Speaker vs Chairman comparison) | Leader of House, Leader of Opposition (1977 Act, 10% convention, statutory selection panels), Whip (pure convention) & Secretariats (Art. 98)",
  "4. Sessions, Conduct of Business, Motions & Devices (Articles 85–87, 100, 118–120) :: Summoning (max 6-month gap; Budget/Monsoon/Winter; Lame-duck session), Adjournment vs Adjournment *sine die* vs Prorogation vs Dissolution | Quorum (1/10th incl. Chair), Language (Art. 120), President's Special Address & Motion of Thanks (Art. 87) | Question Hour (Starred, Unstarred, Short Notice, Private Members) & Zero Hour (1962 Indian innovation, outside Rules) | Motions: Substantive/Substitute/Subsidiary, Closure (4 types incl. Kangaroo & Guillotine), Privilege, Calling Attention (1954 Indian innovation, IN Rules), Adjournment (LS only, 50 MPs, censure), No-Confidence vs Censure, No-Day-Yet-Named, Dilatory, Point of Order, Half-an-Hour, Short Duration, Special Mention | Resolutions (Private/Govt/Statutory) & Youth Parliament",
  "5. Legislative Procedure, Kinds of Bills, Lapsing & Joint Sitting (Articles 107–111, 117) :: Public vs Private Member Bills | Five stages of an Ordinary Bill (First, Second — Committee scrutiny, Third Reading, Other House, Presidential Assent Art. 111) | Money Bills (Article 110: exhaustive 6 criteria, Speaker's final certification & *Rojer Mathew* 2019 7-judge reference, LS only with prior Presidential recommendation, RS 14-day max & no amend/reject, no Joint Sitting, no return by President) | Financial Bills Category I (Art. 117(1)) & Category II (Art. 117(3)) — exhaustive 4-way matrix (Ordinary vs Money vs Fin I vs Fin II) | Exact Rules of Lapsing of Bills on Dissolution of LS (Art. 107(5) — 6 scenarios!) | Joint Sitting (Article 108: Ordinary & Financial Bills ONLY — NEVER Money or Art. 368; 3 deadlock triggers; Speaker→Dy Speaker→Dy Chairman presides, NEVER RS Chairman; simple majority; 3 historic instances: Dowry 1961, Banking Service 1978, POTA 2002)",
  "6. The Union Budget, Financial Control & Funds (Articles 112–116, 266–267) :: Annual Financial Statement (Art. 112 — word 'Budget' absent; 2017 reforms: Feb 1, Rail merger, Plan/Non-Plan end) | Charged vs Voted Expenditure (Art. 112(3) — complete list) | Six Stages of Budget Enactment (Presentation, General Discussion, DRSC scrutiny, Voting on Demands for Grants — LS ONLY, Appropriation Bill Art. 114, Finance Bill Art. 110 — 75 days) | Cut Motions (Policy ₹1, Economy, Token ₹100) & Six Special Grants (Supplementary, Additional, Excess, Vote of Credit, Exceptional, Token; Vote on Account Art. 116) | Consolidated Fund of India (Art. 266(1)), Public Account of India (Art. 266(2)) & Contingency Fund of India (Art. 267 — ₹30,000 crore, President/Finance Secretary)",
  "7. Parliamentary Committees :: Standing vs Ad-hoc; Financial Committees in depth: Public Accounts Committee (PAC — 22 = 15 LS + 7 RS, 1921, Opposition Chair since 1967, CAG friend/philosopher/guide, no ministers), Estimates Committee (30 LS ONLY — largest, 1950, 'continuous economy committee'), Committee on Public Undertakings (COPU — 22 = 15+7, 1964 Krishna Menon) | 24 Departmentally Related Standing Committees (DRSCs — 16 LS + 8 RS; 31 = 21 LS + 10 RS each) | Committees to Inquire (Petitions, Privileges, Ethics), Scrutinise (Govt Assurances, Subordinate Legislation, Papers Laid, SC/ST Welfare, Women Empowerment, Office of Profit), House-keeping (BAC, Rules, General Purposes, Private Members' Bills) & Consultative Committees",
  "8. Parliamentary Privileges, Anti-Defection Law & Institutional Reforms :: Privileges (Art. 105: Collective — publish/exclude/punish contempt/inner proceedings Art. 122 vs Individual — freedom of speech, 40-day civil-only arrest freedom, jury exemption; Non-codification debate; *Sita Soren v. Union of India* March 2024 7-judge unanimous overruling *P.V. Narasimha Rao* 1998 — NO bribery immunity!) | Tenth Schedule Anti-Defection Law (52nd Amend 1985 & 91st Amend 2003 deleting 1/3rd split, keeping 2/3rd merger): 4 grounds (voluntary giving up membership, whip defiance, independent joining party, nominated joining after 6 months), Speaker's role & Judicial Review (*Kihoto Hollohan* 1992, *Keisham Meghachandra* 2020 3-month limit, *Subhash Desai* 2023 Maharashtra whip/split ruling), reform proposals (independent tribunal — Dinesh Goswami/Law Commission) | Position of Rajya Sabha (Equal vs Unequal vs Exclusive Powers: Arts. 249, 312, VP removal, Emergency continuation) | Decline of Parliament (falling sitting days, ordinance raj, declining committee referrals, disruptions) & Mains Way Forward",
