# Mentor-written connections between textbook chapters (1 chunk = 1 chapter).
# Either end may point to a chapter not written yet; the app shows it once both exist.

# ---- polity-historical-background ----

[[link]]
from = "polity-historical-background"
to = "modern-india-british-conquest-administration"
kind = "same-era"
why = "The Acts of 1773 to 1853 regulated territory won at Plassey and Buxar and in the Mysore, Maratha and Sikh wars; Parliament's control tightened with each conquest."

[[link]]
from = "polity-historical-background"
to = "modern-india-land-revenue-economic-impact"
kind = "leads-to"
why = "The Charter Act of 1813 ended the Company's monopoly except for tea and the China trade, opening India to British manufactures: the starting point of the deindustrialisation debate."

[[link]]
from = "polity-historical-background"
to = "modern-india-education-press-reformers"
kind = "leads-to"
why = "The ₹1 lakh a year for education in the 1813 Act began the Orientalist–Anglicist controversy, which Macaulay's Minute of 1835 settled in favour of English education."

[[link]]
from = "polity-historical-background"
to = "governance-civil-services"
kind = "leads-to"
why = "Open competition for the civil services began with the Charter Act of 1853 and the Macaulay Committee (1854), the root of today's merit-based services and the debates on reforming them."

[[link]]
from = "polity-historical-background"
to = "polity-federalism-interstate"
kind = "leads-to"
why = "The 1833 Act made one Governor-General the sole law-maker for British India. That tradition of a strong Centre runs through to the unitary features of Indian federalism."

[[link]]
from = "polity-historical-background"
to = "modern-india-resistance-revolt-1857"
kind = "builds-on"
why = "The Government of India Act 1858 was Parliament's answer to the Revolt of 1857; its causes and consequences explain why the Company could not survive it."

[[link]]
from = "polity-historical-background"
to = "modern-india-early-nationalism-swadeshi"
kind = "same-era"
why = "The Morley–Minto reforms (1909) followed the Partition of Bengal and the Surat split (1907). Separate electorates came while the Moderates were being courted and the Muslim League was new (1906)."

[[link]]
from = "polity-historical-background"
to = "modern-india-civil-disobedience-1937"
kind = "same-era"
why = "The 1935 Act grew out of the Simon Commission, the Round Table Conferences and the Poona Pact (1932): the constitutional track that ran alongside Civil Disobedience."

[[link]]
from = "polity-historical-background"
to = "modern-india-quit-india-ina-independence"
kind = "leads-to"
why = "The Mountbatten Plan of 3 June 1947 was given legal form by the Indian Independence Act, which created the two dominions and made their Constituent Assemblies sovereign."

[[link]]
from = "polity-historical-background"
to = "society-empowerment-secularism-communalism"
kind = "leads-to"
why = "Separate electorates, begun in 1909 and widened in 1919 and 1935, built religious division into representation, a key thread in any answer on the roots of communalism and partition."

# ---- polity-making-of-the-constitution ----

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-salient-features-preamble"
kind = "leads-to"
why = "Nehru's Objectives Resolution, moved on 13 December 1946 and adopted on 22 January 1947, became the Preamble: an independent sovereign republic promising justice, liberty and equality."

[[link]]
from = "polity-making-of-the-constitution"
to = "modern-india-post-independence-consolidation"
kind = "same-era"
why = "The Assembly framed the Constitution while Patel and V.P. Menon integrated the princely states; the states' representatives joined the Assembly as their rulers acceded."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-historical-background"
kind = "builds-on"
why = "The Cabinet Mission (1946) decided how the Assembly was composed, and the Indian Independence Act (1947) made it sovereign and the Dominion legislature."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-fundamental-rights"
kind = "leads-to"
why = "Patel's Advisory Committee and J.B. Kripalani's sub-committee on Fundamental Rights drafted what became Part III of the Constitution."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-reservation-official-language"
kind = "leads-to"
why = "Ambedkar's warning of a 'life of contradictions' explains why the framers wrote Articles 16(4), 17 and 46 into the Constitution: political equality had to be backed by social measures."

# ---- polity-salient-features-preamble ----

[[link]]
from = "polity-salient-features-preamble"
to = "polity-amendment-basic-structure"
kind = "leads-to"
why = "Kesavananda Bharati (1973), which held the Preamble to be part of the Constitution, also created the basic structure doctrine that limits every amendment, the Preamble's included."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-federalism-interstate"
kind = "compare"
why = "Single citizenship and a single constitution sit beside a federal division of powers. Compare them with the US model of dual citizenship and state constitutions to explain India's 'federation with a unitary bias'."

[[link]]
from = "polity-salient-features-preamble"
to = "society-empowerment-secularism-communalism"
kind = "same-issue"
why = "Constitutional secularism (Articles 25–28, S.R. Bommai, 1994) and secularism as a social reality (communalism, the Uniform Civil Code debate) are one issue seen from GS-2 and GS-1."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-elections-parties-reforms"
kind = "leads-to"
why = "Universal adult franchise under Article 326, with the voting age at 18 since the 61st Amendment, is put into practice through the Representation of the People Acts and the Election Commission."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-parliamentary-comparative"
kind = "compare"
why = "The table of borrowed features is the starting point for comparing India's Constitution with those of Britain, the US, Ireland, Canada and Australia, a GS-2 syllabus line of its own."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-dpsp-duties"
kind = "example-of"
why = "The Preamble's justice (social, economic and political) is made concrete in the Directive Principles, above all Article 38's call for a social order based on justice."

# ---- polity-union-territory-citizenship ----

[[link]]
from = "polity-union-territory-citizenship"
to = "modern-india-post-independence-consolidation"
kind = "same-issue"
why = "The power to redraw states (Articles 2–4) and the history of linguistic reorganisation (Potti Sriramulu, the Fazl Ali Commission, the 1956 Act) are one story told in GS-2 and GS-1."

[[link]]
from = "polity-union-territory-citizenship"
to = "polity-union-territories-special-areas"
kind = "leads-to"
why = "The Jammu and Kashmir Reorganisation Act, 2019, passed under Article 3, created the Union territories of Jammu and Kashmir and Ladakh; the UT note covers how they and Delhi are governed."

[[link]]
from = "polity-union-territory-citizenship"
to = "ir-united-nations-global-issues"
kind = "same-issue"
why = "Overseas Citizenship of India, Article 8 and Pravasi Bharatiya Divas link citizenship law to diaspora policy, an international relations topic in GS-2."

[[link]]
from = "polity-union-territory-citizenship"
to = "security-borders-forces"
kind = "same-issue"
why = "The CAA, Section 6A and the Assam NRC all deal with illegal migration from Bangladesh, which the internal security syllabus treats as a border-management problem."

# ---- polity-salient-features-preamble ----

[[link]]
from = "polity-salient-features-preamble"
to = "polity-parliament"
kind = "leads-to"
why = "The Tenth Schedule is the anti-defection law (52nd Amendment, 1985; tightened by the 91st, 2003). Kihoto Hollohan (1992) and the Speaker's role in disqualification are covered with Parliament."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-reservation-official-language"
kind = "compare"
why = "The Eighth Schedule's 22 languages are often confused with the Union's official language (Hindi, with English, under Article 343) and with classical-language status, a separate government scheme."

[[link]]
from = "polity-salient-features-preamble"
to = "economy-land-reforms-cropping"
kind = "same-issue"
why = "The Ninth Schedule was created to shield zamindari abolition and land reform laws, which GS-3 studies as land reforms."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-local-government"
kind = "leads-to"
why = "The Eleventh Schedule's 29 subjects are what states may devolve to panchayats under Article 243G; how much they actually devolve is the heart of the 'three Fs' debate."

# ---- polity-fundamental-rights ----

[[link]]
from = "polity-fundamental-rights"
to = "polity-dpsp-duties"
kind = "compare"
why = "Fundamental Rights are justiciable and mostly negative; Directive Principles are non-justiciable and positive. Minerva Mills (1980) made the balance between them part of the basic structure."

[[link]]
from = "polity-fundamental-rights"
to = "polity-reservation-official-language"
kind = "leads-to"
why = "Articles 15(4), 16(4) and 16(4A) are the constitutional base of reservation; Indra Sawhney, the creamy layer and the 50% ceiling are developed in the reservation note."

[[link]]
from = "polity-fundamental-rights"
to = "social-justice-scs-sts-minorities"
kind = "same-issue"
why = "Article 17 and the SC/ST (Prevention of Atrocities) Act, 1989 are the polity side of the welfare of Scheduled Castes, which social justice covers through schemes and institutions."

[[link]]
from = "polity-fundamental-rights"
to = "society-diversity-social-institutions"
kind = "same-issue"
why = "Untouchability and caste discrimination, outlawed by Articles 15 and 17, are studied as social realities under the caste system in GS-1."

[[link]]
from = "polity-fundamental-rights"
to = "polity-amendment-basic-structure"
kind = "leads-to"
why = "L. Chandra Kumar (1997) made judicial review under Articles 32 and 226 part of the basic structure, and Minerva Mills (1980) struck down the 42nd Amendment's extension of Article 31C."

[[link]]
from = "polity-fundamental-rights"
to = "polity-emergency"
kind = "compare"
why = "Article 358 suspends Article 19 by itself, only in a war or external-aggression emergency; Article 359 lets the President suspend enforcement of other rights, but never Articles 20 and 21."

[[link]]
from = "polity-fundamental-rights"
to = "modern-india-post-independence-polity-world"
kind = "same-era"
why = "ADM Jabalpur (1976), which let the government suspend habeas corpus, was decided during the Emergency of 1975–77; the 44th Amendment's protection of Article 21 was the response."

[[link]]
from = "polity-fundamental-rights"
to = "science-tech-digital-semiconductors"
kind = "same-issue"
why = "Privacy under Article 21 (Puttaswamy, 2017) led to the Digital Personal Data Protection Act, 2023, which GS-3 studies as data protection and cyber law."

[[link]]
from = "polity-fundamental-rights"
to = "environment-climate-change-action"
kind = "same-issue"
why = "The right to be free from the adverse effects of climate change (M.K. Ranjitsinh, 2024) ties Article 21 to India's climate commitments and to protecting the Great Indian Bustard."

[[link]]
from = "polity-fundamental-rights"
to = "social-justice-education-skills"
kind = "same-issue"
why = "Article 21A and the RTE Act, 2009, with its 25% quota in private unaided schools, are the rights side of school education in GS-2 social justice."

[[link]]
from = "polity-fundamental-rights"
to = "security-terrorism-organised-crime"
kind = "same-issue"
why = "Preventive detention under Article 22 and laws such as the NSA and the UAPA raise the same liberty-versus-security question that GS-3 internal security asks."

[[link]]
from = "polity-fundamental-rights"
to = "polity-elections-parties-reforms"
kind = "example-of"
why = "Voters' right to know (ADR, 2002; PUCL, 2003), NOTA (2013) and the striking down of electoral bonds (2024) show Article 19(1)(a) driving electoral reform."

[[link]]
from = "polity-fundamental-rights"
to = "society-empowerment-secularism-communalism"
kind = "same-issue"
why = "Articles 25–28 are the legal frame of Indian secularism; GS-1 society discusses secularism, communalism and the Uniform Civil Code as social questions."

[[link]]
from = "polity-fundamental-rights"
to = "social-justice-women-children-elderly-pwd"
kind = "same-issue"
why = "Articles 23 and 24, the Child Labour Amendment Act of 2016 and the NCPCR connect to the GS-2 topic on laws and schemes for women and children."

[[link]]
from = "polity-fundamental-rights"
to = "economy-poverty-employment"
kind = "same-issue"
why = "The Labour Codes in force from 21 November 2025, including the Code on Wages and its national floor wage, give effect to Article 23's ban on forced labour as read in PUDR (1982)."

[[link]]
from = "polity-fundamental-rights"
to = "polity-supreme-court-judicial-review"
kind = "compare"
why = "Public interest litigation, born of the relaxed locus standi under Article 32 (S.P. Gupta, 1981), is the main ground of the debate on judicial activism versus overreach."

[[link]]
from = "polity-fundamental-rights"
to = "polity-high-courts-tribunals-adr"
kind = "compare"
why = "Article 226 gives High Courts a wider writ jurisdiction than Article 32 ('any other purpose'), but a discretionary one: compare the two when answering on access to justice."

[[link]]
from = "polity-fundamental-rights"
to = "security-borders-forces"
kind = "same-issue"
why = "Article 33 lets Parliament restrict the rights of the armed forces and police (the Army Act, 1950; the Police Forces Act, 1966), linking Part III to the security forces in GS-3."

# ---- polity-dpsp-duties ----

[[link]]
from = "polity-dpsp-duties"
to = "polity-amendment-basic-structure"
kind = "leads-to"
why = "Article 31C, added by the 25th Amendment and widened by the 42nd, was the ground on which Parliament and the Court fought over the amending power; Minerva Mills (1980) made the balance between Parts III and IV a basic feature."

[[link]]
from = "polity-dpsp-duties"
to = "polity-local-government"
kind = "leads-to"
why = "Article 40's directive to organise village panchayats waited 42 years: the 73rd Amendment (1992) turned it into Part IX and the Eleventh Schedule."

[[link]]
from = "polity-dpsp-duties"
to = "economy-land-reforms-cropping"
kind = "same-issue"
why = "Article 39(b) and (c) are the directives behind zamindari abolition and land ceilings; Articles 31A, 31B and 31C were written to protect those laws, and Property Owners Association (2024) now limits what counts as a material resource of the community."

[[link]]
from = "polity-dpsp-duties"
to = "society-empowerment-secularism-communalism"
kind = "same-issue"
why = "Article 44's Uniform Civil Code is a GS-1 question on secularism as much as a GS-2 one: Shah Bano (1985), the Uttarakhand code in force since 27 January 2025 and Gujarat's Act of 2026."

[[link]]
from = "polity-dpsp-duties"
to = "economy-poverty-employment"
kind = "same-issue"
why = "Articles 41 and 43 (the right to work and a living wage) are carried out through the rural job guarantee, MGNREGA until the VB-G RAM G Act replaced it on 1 July 2026, and the four Labour Codes in force since 21 November 2025."

[[link]]
from = "polity-dpsp-duties"
to = "environment-institutions-laws"
kind = "same-issue"
why = "Article 48A and the duty in Article 51A(g), both added by the 42nd Amendment, are the constitutional base the courts read with Article 21 to uphold the Environment (Protection) Act, 1986 and the forest and wildlife laws."

[[link]]
from = "polity-dpsp-duties"
to = "polity-reservation-official-language"
kind = "leads-to"
why = "Champakam Dorairajan (1951) struck down communal quotas despite Article 46, and the 1st Amendment answered with Article 15(4); Article 335, a directive outside Part IV, balances SC and ST claims with efficiency."

[[link]]
from = "polity-dpsp-duties"
to = "polity-high-courts-tribunals-adr"
kind = "leads-to"
why = "Article 39A (free legal aid, 42nd Amendment) led to the Legal Services Authorities Act, 1987, which set up NALSA and gave Lok Adalats their statutory footing."

[[link]]
from = "polity-dpsp-duties"
to = "social-justice-education-skills"
kind = "same-issue"
why = "The 86th Amendment (2002) changed three places at once: Article 21A for ages six to fourteen, Article 45 for early childhood care up to six, and the parent's duty in Article 51A(k). The RTE Act and NEP 2020 build on all three."

# ---- polity-amendment-basic-structure ----

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-federalism-interstate"
kind = "example-of"
why = "The proviso to Article 368(2), ratification by half the states, is the amending procedure's federal safeguard; Rajendra N. Shah (2021) enforced it by striking down Part IXB for state co-operatives."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-centre-state-fiscal"
kind = "leads-to"
why = "The 101st Amendment (2016) created the GST and the GST Council under Article 279A, and added Article 279A to the provisions that cannot be amended without the states."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-reservation-official-language"
kind = "leads-to"
why = "The 77th, 81st, 82nd and 85th Amendments on promotions, the 102nd and 105th on backward-class lists and the 103rd on the EWS quota each answered a Supreme Court ruling on reservation."

[[link]]
from = "polity-amendment-basic-structure"
to = "modern-india-post-independence-polity-world"
kind = "same-era"
why = "Kesavananda (1973), the supersession of three judges the next day, the 39th and 42nd Amendments and Raj Narain (1975) all belong to the Indira Gandhi years and the Emergency."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-parliament"
kind = "compare"
why = "An amendment bill differs from an ordinary bill at each step: a special majority in each House, no joint sitting under Article 108, and assent the President cannot refuse."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-elections-parties-reforms"
kind = "leads-to"
why = "The 84th and 87th Amendments froze the allocation of seats on the 1971 census until the first census after 2026; the women's quota of the 106th Amendment and the defeated 131st Bill (April 2026) both turn on that delimitation."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-local-government"
kind = "leads-to"
why = "The 73rd and 74th Amendments (1992) added Parts IX and IXA and the Eleventh and Twelfth Schedules, giving local government its constitutional status."

[[link]]
from = "polity-amendment-basic-structure"
to = "modern-india-post-independence-consolidation"
kind = "same-issue"
why = "The 7th Amendment (1956) carried out the States Reorganisation Act: the old Part A, B, C and D states gave way to 14 states and 6 Union territories."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-parliamentary-comparative"
kind = "compare"
why = "Germany's Article 79(3) writes into the text what India's judges inferred; Bangladesh adopted the doctrine in 1989, and Kenya's Supreme Court declined to in 2022."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-supreme-court-judicial-review"
kind = "leads-to"
why = "Judicial review is itself a basic feature (Minerva Mills, L. Chandra Kumar), and the NJAC ruling of 2015 is the sharpest case in the debate on judicial activism and overreach."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-emergency"
kind = "leads-to"
why = "S.R. Bommai (1994) used the basic features of federalism and secularism to test President's rule under Article 356, taking the doctrine beyond amendments to executive action."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-high-courts-tribunals-adr"
kind = "leads-to"
why = "Sampath Kumar, L. Chandra Kumar and the Madras Bar Association cases applied judicial review and judicial independence to tribunals; the Tribunals Reforms Act, 2026 is Parliament's answer to the last of them."

[[link]]
from = "polity-amendment-basic-structure"
to = "polity-constitutional-bodies"
kind = "leads-to"
why = "Free and fair elections are a basic feature (Raj Narain, 1975); Anoop Baranwal (2023) drew from it the need for an independent way of appointing Election Commissioners, which the 2023 Act now tests."

# ---- polity-parliamentary-comparative ----

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-prime-minister-cabinet"
kind = "leads-to"
why = "Collective responsibility under Article 75(3), the 15 per cent cap of the 91st Amendment and the working of the Cabinet and its committees are set out in detail there."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-president-vice-president"
kind = "leads-to"
why = "The President is the nominal executive, bound by ministerial advice under Article 74; how much discretion the office still has is the question that note answers."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-historical-background"
kind = "builds-on"
why = "Dyarchy under the 1919 Act and the provincial ministries of 1937 under the 1935 Act gave Indians their experience of responsible government, the familiarity the Assembly relied on."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-making-of-the-constitution"
kind = "builds-on"
why = "Ambedkar's speech of 4 November 1948 introducing the Draft Constitution is where the choice of responsibility over stability is explained."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-parliament"
kind = "leads-to"
why = "The British Speaker resigns from the party on election; India's decides defection cases while remaining a party member, the root of the demand for an independent tribunal."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-amendment-basic-structure"
kind = "leads-to"
why = "Parliamentary democracy is a basic feature (Kuldip Nayar, 2006), which is why a switch to a presidential system could not be made even by amendment."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-state-legislature"
kind = "compare"
why = "Articles 163 and 164 repeat the parliamentary model in the states, with the Governor in the President's place and responsibility owed to the Legislative Assembly."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-salient-features-preamble"
kind = "builds-on"
why = "The table of borrowed features there is the starting list; this note explains how each borrowing was changed to suit India."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-federalism-interstate"
kind = "compare"
why = "America's coming-together federation of indestructible states is the contrast to India's holding-together Union under Article 3, with Canada the nearer model for a strong Centre."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-supreme-court-judicial-review"
kind = "compare"
why = "US judges are nominated by the President, confirmed by the Senate and sit for life; Indian judges come through the Collegium and retire at 65. Mains 2025 asked for exactly this comparison."

[[link]]
from = "polity-parliamentary-comparative"
to = "society-empowerment-secularism-communalism"
kind = "same-issue"
why = "French laicite keeps religion out of public institutions; Indian secularism keeps a principled distance and lets the State reform religious practice. GS-1 asks the same comparison."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-fundamental-rights"
kind = "compare"
why = "Article 21 took 'procedure established by law' from Japan in preference to American due process; Maneka Gandhi (1978) brought the two close again."

[[link]]
from = "polity-parliamentary-comparative"
to = "world-history-modern-age-revolutions"
kind = "same-issue"
why = "The American Constitution of 1787 and the French Revolution's liberty, equality and fraternity are GS-1 world history; here they are sources of India's rights, judicial review and Preamble."

[[link]]
from = "polity-parliamentary-comparative"
to = "polity-state-executive"
kind = "compare"
why = "Canada's federally appointed Lieutenant Governors and the power to disallow provincial laws fell into disuse; India's Governors and Articles 200 and 201 are still live disputes."

