why = "Delhi under Article 239AA and Jammu and Kashmir since 2019 show the asymmetry at its sharpest: elected legislatures without full statehood."

[[link]]
from = "polity-federalism-interstate"
to = "modern-india-post-independence-consolidation"
kind = "same-issue"
why = "The States Reorganisation Act, 1956 created the Zonal Councils, and its boundaries, with the later states carved out of Assam, left the Belagavi and North-East border disputes."

[[link]]
from = "polity-federalism-interstate"
to = "economy-planning-reforms"
kind = "same-issue"
why = "NITI Aayog replaced the Planning Commission in 2015; its Governing Council and its indices are the instruments of cooperative and competitive federalism."

[[link]]
from = "polity-federalism-interstate"
to = "polity-elections-parties-reforms"
kind = "leads-to"
why = "The freeze on seats until the first census after 2026, and the defeat of the 131st Amendment Bill in April 2026, make delimitation the next federal test."

