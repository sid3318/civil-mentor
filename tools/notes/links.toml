# Connections between notes, written by Claude as each chunk is verified.
# Kinds: builds-on (read the other first), leads-to (a cause, or what followed),
# same-era (contemporaries), compare (asked together, or confused), same-issue
# (the same issue in another subject or paper), example-of (a case of the other).
# A link may point to a note not written yet; it shows once that note exists.

# ---- polity-constitutional-history-company ----

[[link]]
from = "polity-constitutional-history-company"
to = "polity-constitutional-history-crown"
kind = "leads-to"
why = "The 1853 Act left the Company's charter without a fixed term; after the Revolt of 1857, the Government of India Act 1858 ended Company rule and the Crown governed directly."

[[link]]
from = "polity-constitutional-history-company"
to = "modern-india-british-conquest"
kind = "same-era"
why = "The Acts of 1773 to 1853 regulated territory won at Plassey and Buxar and in the Mysore, Maratha and Sikh wars; Parliament's control tightened with each conquest."

[[link]]
from = "polity-constitutional-history-company"
to = "modern-india-economic-impact"
kind = "leads-to"
why = "The Charter Act of 1813 ended the Company's monopoly except for tea and the China trade, opening India to British manufactures: the starting point of the deindustrialisation debate."

[[link]]
from = "polity-constitutional-history-company"
to = "modern-india-women-education-press"
kind = "leads-to"
why = "The ₹1 lakh a year for education in the 1813 Act began the Orientalist–Anglicist controversy, which Macaulay's Minute of 1835 settled in favour of English education."

[[link]]
from = "polity-constitutional-history-company"
to = "governance-civil-services"
kind = "leads-to"
why = "Open competition for the civil services began with the Charter Act of 1853 and the Macaulay Committee (1854), the root of today's merit-based services and the debates on reforming them."

[[link]]
from = "polity-constitutional-history-company"
to = "polity-federalism"
kind = "leads-to"
why = "The 1833 Act made one Governor-General the sole law-maker for British India. That tradition of a strong Centre runs through to the unitary features of Indian federalism."

# ---- polity-constitutional-history-crown ----

[[link]]
from = "polity-constitutional-history-crown"
to = "modern-india-revolt-1857"
kind = "builds-on"
why = "The Government of India Act 1858 was Parliament's answer to the Revolt of 1857; its causes and consequences explain why the Company could not survive it."

[[link]]
from = "polity-constitutional-history-crown"
to = "modern-india-swadeshi-extremists"
kind = "same-era"
why = "The Morley–Minto reforms (1909) followed the Partition of Bengal and the Surat split (1907). Separate electorates came while the Moderates were being courted and the Muslim League was new (1906)."

[[link]]
from = "polity-constitutional-history-crown"
to = "modern-india-civil-disobedience"
kind = "same-era"
why = "The 1935 Act grew out of the Simon Commission, the Round Table Conferences and the Poona Pact (1932): the constitutional track that ran alongside Civil Disobedience."

[[link]]
from = "polity-constitutional-history-crown"
to = "modern-india-independence-partition"
kind = "leads-to"
why = "The Mountbatten Plan of 3 June 1947 was given legal form by the Indian Independence Act, which created the two dominions and made their Constituent Assemblies sovereign."

[[link]]
from = "polity-constitutional-history-crown"
to = "polity-federalism"
kind = "leads-to"
why = "The 1935 Act's federal scheme (three lists, provincial autonomy, governors with special powers) became the structural frame of the Constitution's federalism."

[[link]]
from = "polity-constitutional-history-crown"
to = "society-communalism-regionalism-secularism"
kind = "leads-to"
why = "Separate electorates, begun in 1909 and widened in 1919 and 1935, built religious division into representation, a key thread in any answer on the roots of communalism and partition."

# ---- polity-making-of-the-constitution ----

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-salient-features-preamble"
kind = "leads-to"
why = "Nehru's Objectives Resolution, moved on 13 December 1946 and adopted on 22 January 1947, became the Preamble: an independent sovereign republic promising justice, liberty and equality."

[[link]]
from = "polity-making-of-the-constitution"
to = "modern-india-integration"
kind = "same-era"
why = "The Assembly framed the Constitution while Patel and V.P. Menon integrated the princely states; the states' representatives joined the Assembly as their rulers acceded."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-constitutional-history-crown"
kind = "builds-on"
why = "The Cabinet Mission (1946) decided how the Assembly was composed, and the Indian Independence Act (1947) made it sovereign and the Dominion legislature."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-fundamental-rights"
kind = "leads-to"
why = "Patel's Advisory Committee and J.B. Kripalani's sub-committee on Fundamental Rights drafted what became Part III of the Constitution."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-official-language"
kind = "leads-to"
why = "The Assembly's sharpest debate was over language. The Munshi–Ayyangar formula, Hindi in Devanagari with English continuing for fifteen years, became Part XVII."

[[link]]
from = "polity-making-of-the-constitution"
to = "polity-reservation"
kind = "leads-to"
why = "Ambedkar's warning of a 'life of contradictions' explains why the framers wrote Articles 16(4), 17 and 46 into the Constitution: political equality had to be backed by social measures."

# ---- polity-salient-features-preamble ----

[[link]]
from = "polity-salient-features-preamble"
to = "polity-basic-structure"
kind = "leads-to"
why = "Kesavananda Bharati (1973), which held the Preamble to be part of the Constitution, also created the basic structure doctrine that limits every amendment, the Preamble's included."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-federalism"
kind = "compare"
why = "Single citizenship and a single constitution sit beside a federal division of powers. Compare them with the US model of dual citizenship and state constitutions to explain India's 'federation with a unitary bias'."

[[link]]
from = "polity-salient-features-preamble"
to = "society-communalism-regionalism-secularism"
kind = "same-issue"
why = "Constitutional secularism (Articles 25–28, S.R. Bommai, 1994) and secularism as a social reality (communalism, the Uniform Civil Code debate) are one issue seen from GS-2 and GS-1."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-elections-rpa"
kind = "leads-to"
why = "Universal adult franchise under Article 326, with the voting age at 18 since the 61st Amendment, is put into practice through the Representation of the People Acts and the Election Commission."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-comparative-constitutions"
kind = "compare"
why = "The table of borrowed features is the starting point for comparing India's Constitution with those of Britain, the US, Ireland, Canada and Australia, a GS-2 syllabus line of its own."

[[link]]
from = "polity-salient-features-preamble"
to = "polity-dpsp-duties"
kind = "example-of"
why = "The Preamble's justice (social, economic and political) is made concrete in the Directive Principles, above all Article 38's call for a social order based on justice."

