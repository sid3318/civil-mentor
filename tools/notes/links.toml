[[link]]
from = "polity-federalism-interstate"
to = "polity-state-executive"
kind = "leads-to"
why = "What Sarkaria and Punchhi said about the Governor, and the rulings of 2025 on assent to Bills, are developed there."

[[link]]
from = "polity-federalism-interstate"
to = "polity-emergency"
kind = "leads-to"
why = "Article 356 is the provision every commission wanted restrained; S.R. Bommai (1994), which made federalism a basic feature, did it."

[[link]]
from = "polity-federalism-interstate"
to = "polity-union-territories-special-areas"
