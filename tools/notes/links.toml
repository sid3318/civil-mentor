to = "social-justice-scs-sts"
kind = "same-issue"
why = "Article 17 and the SC/ST (Prevention of Atrocities) Act, 1989 are the polity side of the welfare of Scheduled Castes, which social justice covers through schemes and institutions."

[[link]]
from = "polity-fundamental-rights"
to = "society-family-caste-tribe"
kind = "same-issue"
why = "Untouchability and caste discrimination, outlawed by Articles 15 and 17, are studied as social realities under the caste system in GS-1."

[[link]]
from = "polity-fundamental-rights"
to = "polity-dpsp-duties"
kind = "compare"
why = "Fundamental Rights are justiciable and mostly negative; Directive Principles are non-justiciable and positive. Minerva Mills (1980) made the balance between them part of the basic structure."

[[link]]
from = "polity-fundamental-rights"
to = "polity-basic-structure"
kind = "leads-to"
why = "Article 13 and the 24th Amendment led to Kesavananda Bharati (1973): an amendment is not 'law' under Article 13, but it cannot destroy the basic structure."

# ---- polity-rights-freedom ----

[[link]]
from = "polity-rights-freedom"
to = "polity-emergency"
kind = "compare"
why = "Article 358 suspends Article 19 by itself, only in a war or external-aggression emergency; Article 359 lets the President suspend enforcement of other rights, but never Articles 20 and 21."

[[link]]
from = "polity-rights-freedom"
to = "modern-india-politics"
kind = "same-era"
why = "ADM Jabalpur (1976), which let the government suspend habeas corpus, was decided during the Emergency of 1975–77; the 44th Amendment's protection of Article 21 was the response."

[[link]]
from = "polity-rights-freedom"
to = "science-tech-semiconductors-data"
kind = "same-issue"
why = "Privacy under Article 21 (Puttaswamy, 2017) led to the Digital Personal Data Protection Act, 2023, which GS-3 studies as data protection and cyber law."

[[link]]
from = "polity-rights-freedom"
to = "environment-climate-action"
kind = "same-issue"
why = "The right to be free from the adverse effects of climate change (M.K. Ranjitsinh, 2024) ties Article 21 to India's climate commitments and to protecting the Great Indian Bustard."

[[link]]
from = "polity-rights-freedom"
to = "social-justice-school-education"
kind = "same-issue"
why = "Article 21A and the RTE Act, 2009, with its 25% quota in private unaided schools, are the rights side of school education in GS-2 social justice."

[[link]]
from = "polity-rights-freedom"
to = "security-terrorism-kashmir"
kind = "same-issue"
why = "Preventive detention under Article 22 and laws such as the NSA and the UAPA raise the same liberty-versus-security question that GS-3 internal security asks."

[[link]]
from = "polity-rights-freedom"
to = "polity-electoral-reforms-parties"
kind = "example-of"
why = "Voters' right to know (ADR, 2002; PUCL, 2003), NOTA (2013) and the striking down of electoral bonds (2024) show Article 19(1)(a) driving electoral reform."

