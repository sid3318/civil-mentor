answer = "D"
explanation = "The New Development Bank is headquartered in Shanghai. India, Brazil, Russia, China and South Africa were its founding members."

[[editorial]]
id = "2026-11-13-editorial-urban-flooding"
title = "Why our cities flood: drains, plans and permissions"
topics = ["mains.gs3.disaster.disasters.floods", "mains.gs1.society.urbanisation.urban-problems"]
body = """
Every monsoon, and now often in other seasons, a heavy spell of rain turns a busy road into a river. Rain is the trigger, but the damage comes from choices made over decades: where we build, what we cover in concrete and how we manage water. Calling it a natural disaster hides that.

## Why water has nowhere to go

Cities were once dotted with lakes, ponds and floodplains that held water and let it soak away. As cities grew, many were filled, built over or squeezed. Stormwater drains designed for modest rainfall now serve far larger paved areas. Garbage and silt choke the channels. Roads are raised without thinking about where water will flow. Low-lying colonies, often home to poorer residents, take the worst.

## Three arguments

- **The infrastructure view.** Build bigger drains and pumping stations. This gives quick relief, but it can be costly and can simply move flooding downstream.
- **The nature-based view.** Restore lakes, wetlands and green spaces, and let the ground absorb water. This is cheaper over time and helps in heat and drought too, but it needs land that cities are reluctant to give up.
- **The governance view.** The root problem is divided responsibility. Drains, roads, lakes and rivers belong to different agencies that rarely plan together. Without one accountable body, every plan stays partial.

None of these is enough alone. Drains with no open space only move the problem. Open space without enforcement gets encroached.

## What a better approach looks like

1. **Map flood risk by neighbourhood** and make the maps public, so that building permissions follow them.
2. **Protect water bodies by law and in practice.** Notify them, fence them and punish encroachment, including by powerful builders.
3. **Make space for water.** Permeable pavements, rain gardens and retention ponds in new projects.
4. **Maintain what exists.** Desilting before the rains should be treated as a basic duty with public reporting.
5. **Give one agency a lead role** in urban drainage, with the funds and powers to match.
6. **Warn and prepare.** Local early-warning systems and clear evacuation plans save lives.
7. **Protect the poor.** Resettlement and housing should keep low-income families out of the path of water.

## Conclusion

Urban floods are as much a planning failure as a weather event. Climate change may bring heavier bursts of rain, but cities that keep their water bodies, plan drainage as a system and listen to local knowledge will cope better. The aim should be a city that lives with water, not one that fights it.
"""
