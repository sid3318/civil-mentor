context = "Several shipping lines said they would send vessels around southern Africa instead of through the Red Sea, citing safety concerns, which lengthens voyages and raises costs for importers."
why = "Chokepoints are common in Prelims map questions and in Mains questions on trade and energy security."
facts = [
  "The Suez Canal, opened in 1869, links the Mediterranean Sea with the Red Sea.",
  "The Bab-el-Mandeb strait connects the Red Sea with the Gulf of Aden and lies between Yemen and Djibouti.",
  "The alternative route around the Cape of Good Hope adds many days to a voyage between Asia and Europe.",
  "Djibouti hosts foreign naval bases because it sits beside this chokepoint.",
]
trap = "The Suez Canal is an artificial waterway. The Bab-el-Mandeb and the Strait of Hormuz are natural straits."
mains = "Maritime chokepoints are a vulnerability for India's trade and energy security. Discuss."
frame = [
  "List the chokepoints that matter for India: Hormuz, Bab-el-Mandeb, Malacca, Suez.",
  "Show the effect of disruption: costs, delays, insurance, fuel prices.",
  "Describe India's responses: naval presence, diversified routes and suppliers.",
  "Suggest cooperation with partners and strategic reserves.",
]

[story.question]
id = "ca-2026-11-16-3"
stem = "The Bab-el-Mandeb strait connects the Red Sea with the:"
options = ["Persian Gulf", "Gulf of Oman", "Gulf of Aden", "Mediterranean Sea"]
answer = "C"
explanation = "The Bab-el-Mandeb lies between Yemen and Djibouti and links the Red Sea with the Gulf of Aden. The Suez Canal links the Red Sea with the Mediterranean."

[[story]]
id = "2026-11-16-gm-crops-review"
title = "Regulator reviews an application on a genetically modified crop"
topics = ["pre.gs.science-tech.biotech.gm-crops", "mains.gs3.science-tech.awareness.biotechnology.gm-crops-and-their-regulation", "pre.gs.current.science.new-technologies"]
