  "Article 21A, inserted by the 86th Amendment in 2002, makes free and compulsory education a Fundamental Right for children aged six to fourteen.",
  "The Right of Children to Free and Compulsory Education Act, 2009 came into force on 1 April 2010.",
  "Section 12(1)(c) of the Act requires private unaided schools to reserve 25 per cent of seats in the entry class for children from weaker and disadvantaged sections.",
