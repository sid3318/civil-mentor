]
notes = ["polity-rights-freedom"]

[story.question]
id = "ca-2026-11-16-5"
stem = "Article 21A of the Constitution provides for free and compulsory education for children in the age group of:"
options = ["Six to fourteen years", "Three to six years", "Six to eighteen years", "Fourteen to eighteen years"]
answer = "A"
explanation = "Article 21A, inserted by the 86th Amendment in 2002, covers children aged six to fourteen. The Right to Education Act of 2009 gives effect to it."

[[editorial]]
id = "2026-11-16-editorial-gig-work"
title = "Gig workers and the promise of social security"
topics = ["mains.gs3.economy.planning.employment.labour-codes-and-reforms", "mains.gs3.economy.planning.employment.informal-sector"]
body = """
Delivery riders, ride-hailing drivers and freelance service workers are a fast-growing part of the urban workforce. They are neither traditional employees with fixed wages and benefits nor fully independent business owners. This in-between status raises a hard question: who is responsible for their safety, income and old age?

## Why platform work is attractive

Gig work offers flexibility and a quick way in, especially for young people and those without formal qualifications. Workers can choose hours, and some use it to supplement other incomes. Platforms argue that this flexibility is the reason people choose the work, and that treating them as employees would mean fewer jobs.

## Why it worries many

Flexibility has a cost. Income is irregular and set by algorithms that workers cannot see. A worker who falls ill or has an accident may lose income at once, and has no pension, no paid leave and often limited insurance. Ratings or app rules can lead to being locked out of work without a hearing. Many work long hours to reach a decent income, which raises safety risks.

## Three positions

- **Treat them as employees.** This gives full protection, but may lead platforms to reduce hiring and raise prices.
- **Keep them independent, with a safety net.** A contribution-based social security fund, with payments from platforms and the state, gives protection without changing status.
- **Create a third category.** A separate legal status with some rights, such as minimum earnings, notice before deactivation and insurance.

Recent labour law reforms in India have begun to recognise gig and platform workers and to promise social security schemes, but the scale and detail of funding are still being worked out.

## A workable way forward

1. **Register workers** so that benefits reach them, linked to portable identity and bank accounts.
2. **Pool contributions** from platforms in proportion to what they pay workers, with state support for the poorest.
3. **Make benefits portable.** A worker who uses several apps should have one account that follows them.
4. **Set basic standards**: accident and health cover, grievance redress, and notice with reasons before an account is closed.
5. **Make algorithms more transparent.** Workers should know how pay and tasks are decided.
6. **Support skills.** Training for better jobs helps workers move up and not remain stuck.

## Conclusion

Gig work is likely to grow, so the choice is not between flexibility and security but how to combine them. A modest, funded and portable safety net, with basic fairness in how platforms treat workers, can protect people without killing the model. The test of success is that a rider who is hurt on the job does not fall into poverty.
"""
