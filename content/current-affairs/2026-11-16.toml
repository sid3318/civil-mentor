why = "GM crops combine science, agriculture and ethics. Prelims asks which crop is approved and which body regulates."
facts = [
  "Bt cotton, approved in 2002, is the only genetically modified crop grown commercially in India.",
  "The Genetic Engineering Appraisal Committee, under the Ministry of Environment, Forest and Climate Change, appraises proposals for the release of genetically engineered organisms.",
  "The Committee works under the Rules of 1989 framed under the Environment (Protection) Act, 1986.",
  "Bt cotton carries a gene from the soil bacterium Bacillus thuringiensis that makes the plant produce a protein toxic to certain pests such as the bollworm.",
]
trap = "Bt cotton is not a hybrid made by cross-breeding. A gene from another organism is placed in the plant using genetic engineering."
mains = "Should India permit more genetically modified crops? Discuss both sides."
frame = [
  "Explain GM crops and the regulatory process.",
  "Give the case for: yields, reduced pesticide use, tolerance to stress.",
  "Give the case against: biosafety, seed control by firms, loss of varieties.",
  "Suggest case-by-case approval, independent testing and public data.",
]

[story.question]
id = "ca-2026-11-16-4"
stem = "Which one of the following bodies appraises proposals for the release of genetically engineered organisms into the environment in India?"
options = [
  "Indian Council of Agricultural Research",
  "Food Safety and Standards Authority of India",
  "National Biodiversity Authority",
  "Genetic Engineering Appraisal Committee",
]
answer = "D"
explanation = "The Genetic Engineering Appraisal Committee, under the Environment Ministry, appraises such proposals under rules made under the Environment (Protection) Act, 1986."

