# Sample brief. The stories are illustrative, written to show the format. They are not real news.

[[story]]
id = "2026-11-16-gram-sabha-meetings"
title = "State pushes for regular Gram Sabha meetings on local planning"
topics = ["pre.gs.polity.local.73rd-amendment", "mains.gs2.polity.federalism.devolution.73rd-and-74th-amendments", "pre.gs.current.national.polity-and-governance-developments"]
context = "A state panchayati raj department directed village councils to hold regular Gram Sabha meetings and to discuss the village development plan in them, with attendance records to be made public."
why = "Panchayati raj is a staple of both papers. Know the constitutional provisions and the gap between the law and practice."
facts = [
  "The 73rd Amendment, passed in 1992 and in force from April 1993, added Part IX and the Eleventh Schedule to the Constitution.",
  "The Eleventh Schedule lists 29 subjects for panchayats.",
  "Article 243D reserves not less than one-third of the seats for women, and seats for Scheduled Castes and Scheduled Tribes in proportion to their population.",
  "Article 243K provides for a State Election Commission to conduct panchayat elections.",
]
trap = "The Gram Sabha is all registered voters of a village. The gram panchayat is its elected executive body."

[story.question]
id = "ca-2026-11-16-1"
stem = "The Eleventh Schedule of the Constitution, added by the 73rd Amendment, contains:"
options = [
  "18 subjects for municipalities",
  "29 subjects for panchayats",
  "29 subjects for municipalities",
  "18 subjects for panchayats",
]
answer = "B"
explanation = "The Eleventh Schedule lists 29 subjects for panchayats. The Twelfth Schedule, added by the 74th Amendment, lists 18 subjects for municipalities."

[[story]]
id = "2026-11-16-sebi-appeal"
title = "Securities appellate body hears a challenge to a market regulator order"
topics = ["pre.gs.economy.markets.sebi-and-market-regulation", "mains.gs2.polity.statutory-bodies.regulators", "pre.gs.current.national.constitutional-and-statutory-bodies"]
context = "A market participant appealed an order of the securities regulator to the specialised appellate tribunal, arguing that the penalty was not in proportion to the lapse."
why = "Regulators and their appellate bodies appear in Prelims as institution questions. Know which are statutory and which are constitutional."
facts = [
  "The Securities and Exchange Board of India was set up in 1988 as a non-statutory body and given statutory status through the SEBI Act, 1992.",
  "The Securities Appellate Tribunal hears appeals against SEBI's orders.",
  "SEBI's main aims are to protect investors, to develop the securities market and to regulate it.",
  "SEBI is a statutory body. It is not mentioned in the Constitution.",
]
trap = "SEBI regulates the securities market. The Reserve Bank regulates banks and the money market, and IRDAI regulates insurance."
pyq = "Prelims often asks about regulators and the statutes that created them."

[story.question]
id = "ca-2026-11-16-2"
stem = "Which one of the following statements about the Securities and Exchange Board of India is correct?"
options = [
  "It is a constitutional body under Article 324",
  "It was given statutory status through an Act of Parliament in 1992",
  "It regulates banking and the money market",
  "Appeals against its orders lie directly to the Supreme Court in all cases",
]
answer = "B"
explanation = "SEBI began as a non-statutory body in 1988 and became statutory through the SEBI Act, 1992. Appeals against its orders go first to the Securities Appellate Tribunal."

[[story]]
