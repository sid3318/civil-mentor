# Sample brief. The stories are illustrative, written to show the format. They are not real news.

[[story]]
id = "2026-11-10-defection-petitions"
title = "Delay in deciding disqualification petitions draws criticism"
topics = ["pre.gs.polity.parliament.anti-defection-law", "mains.gs2.polity.legislature.anti-defection-law", "pre.gs.current.national.polity-and-governance-developments"]
context = "Members of a state assembly complained that petitions seeking the disqualification of legislators who changed sides had stayed with the Speaker for a long time, and asked for a fixed timeline."
why = "The Tenth Schedule is a favourite for both papers. Know who decides, what the grounds are and how far courts can review the decision."
facts = [
  "The Tenth Schedule was added by the 52nd Amendment in 1985.",
  "The presiding officer of the House decides disqualification petitions.",
  "In Kihoto Hollohan (1992) the Supreme Court held that the presiding officer's decision is open to judicial review.",
  "The 91st Amendment in 2003 removed the exception for a split in a party and capped the council of ministers at 15 per cent of the strength of the House.",
]
trap = "A merger needs two-thirds of the legislature party. A one-third split no longer protects anyone since 2003."
pyq = "Prelims often asks which amendment added the Tenth Schedule and who decides disqualification. Mains asks whether the presiding officer is the right authority."
mains = "The presiding officer is not the best authority to decide defection cases. Discuss."
frame = [
  "State the law: Tenth Schedule, grounds of disqualification, exceptions.",
  "Give the problem: the officer belongs to a party, and delay can defeat the law.",
  "Note the judicial check in Kihoto Hollohan and calls for time-bound decisions.",
  "Suggest reform: an independent tribunal or the Election Commission, with a fixed deadline.",
]
notes = ["polity-parliament-privileges-issues"]

[story.question]
id = "ca-2026-11-10-1"
stem = "Which one of the following added the Tenth Schedule (anti-defection law) to the Constitution?"
options = ["The 42nd Amendment, 1976", "The 52nd Amendment, 1985", "The 73rd Amendment, 1992", "The 91st Amendment, 2003"]
answer = "B"
explanation = "The 52nd Amendment of 1985 added the Tenth Schedule. The 91st Amendment of 2003 later tightened it by removing the one-third split exception."

[[story]]
id = "2026-11-10-gst-council-meeting"
title = "GST Council takes up a rate rationalisation proposal"
topics = ["pre.gs.economy.fiscal.taxation.goods-and-services-tax", "mains.gs2.polity.constitutional-bodies.gst-council", "pre.gs.current.economy.union-budget-and-economic-survey"]
context = "The GST Council met to discuss a proposal to reduce the number of rate slabs. Some states asked for assurance on their revenue before agreeing to any change."
why = "The Council is a standing example of cooperative federalism. Prelims asks about its composition and voting rules, and Mains about the Centre-state balance."
facts = [
  "Article 279A, inserted by the 101st Amendment in 2016, creates the GST Council.",
  "The Union Finance Minister chairs it. Members include the Union Minister of State for Revenue and the finance or tax ministers of every state.",
  "A decision needs three-fourths of the weighted votes cast.",
  "The Centre holds one-third of the weight and all states together hold two-thirds.",
]
trap = "The Centre cannot pass a decision alone, and the states cannot pass one without the Centre's vote. Both sides hold an effective veto."
mains = "The GST Council shows both the promise and the limits of cooperative federalism. Comment."
frame = [
  "Describe the Council and its voting weights.",
  "Show the gains: one tax, shared decisions, fewer disputes.",
  "Show the strains: loss of state fiscal autonomy, compensation worries.",
  "Suggest a way forward: predictable compensation and a standing dispute mechanism.",
]
notes = ["polity-fiscal-federalism"]

[story.question]
id = "ca-2026-11-10-2"
stem = "In the GST Council, a decision requires the support of:"
options = [
  "A simple majority of the members present",
  "Two-thirds of the weighted votes of the states alone",
  "Three-fourths of the weighted votes of the members present and voting",
  "A unanimous vote of the Centre and all states",
]
answer = "C"
explanation = "Decisions need a majority of not less than three-fourths of the weighted votes cast. The Centre carries one-third of the weight and the states two-thirds."

[[story]]
id = "2026-11-10-hfc-phasedown"
title = "Parties review the phase-down of hydrofluorocarbons"
topics = ["pre.gs.environment.conventions.vienna-convention-montreal-protocol", "mains.gs3.environment.conservation.international-conventions", "pre.gs.current.environment.climate-summits-and-negotiations"]
context = "Countries that are party to the Montreal Protocol met to review how well the phase-down of hydrofluorocarbons, used in cooling equipment, was going and what help developing countries still need."
why = "The ozone treaties are a clean example of a successful global environmental agreement. Prelims tests which gas, which treaty and which year."
facts = [
  "The Vienna Convention for the Protection of the Ozone Layer was adopted in 1985 and the Montreal Protocol in 1987.",
  "The Kigali Amendment of 2016 added hydrofluorocarbons (HFCs) to the Protocol.",
  "HFCs do not harm the ozone layer but are strong greenhouse gases.",
  "India ratified the Kigali Amendment in 2021.",
]
trap = "The Kigali Amendment is about climate warming, not ozone depletion. HFCs replaced ozone-depleting substances."
pyq = "Prelims often asks which protocol deals with ozone-depleting substances and which gases are covered."

[story.question]
id = "ca-2026-11-10-3"
stem = "The Kigali Amendment to the Montreal Protocol seeks to phase down the use of:"
options = ["Chlorofluorocarbons", "Halons", "Persistent organic pollutants", "Hydrofluorocarbons"]
answer = "D"
explanation = "The Kigali Amendment of 2016 targets hydrofluorocarbons. These replaced chlorofluorocarbons and do not deplete ozone, but they trap heat and add to global warming."

