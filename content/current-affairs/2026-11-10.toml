[[editorial]]
id = "2026-11-10-editorial-energy-transition"
title = "Coal today, solar tomorrow: sequencing India's energy transition"
topics = ["mains.gs3.economy.infrastructure.energy.energy-security-and-transition", "mains.gs3.environment.pollution.climate-change"]
body = """
India wants to add large amounts of clean power and, at the same time, keep the lights on for a growing economy. The argument is no longer whether to move to renewable energy but how fast, and what to do with coal in the meantime.

## The case for moving fast

Solar and wind are now among the cheapest sources of new electricity. Every unit they supply reduces fuel imports, local air pollution and exposure to price shocks. Falling costs also mean that a country which builds early gets the manufacturing jobs and learns the skills before others do. For a country with long coastlines and many sunny days, waiting looks like a lost opportunity.

## The case for caution

Electricity is not only about energy. It is also about being there at six in the evening when the sun has set and demand peaks. Coal plants still supply a large share of round-the-clock power, and many states depend on coal for jobs and revenue. A fast exit could strand plants, hurt coal-bearing regions and raise costs if storage and grids are not ready. Grid upgrades, transmission lines and storage take years, not months.

## What the two views share

Both sides accept three facts. First, renewable energy is poorly matched to demand without storage and flexible back-up. Second, the grid is the bottleneck: power must travel from sunny and windy regions to the cities. Third, distribution companies must be financially healthy enough to buy and pay for clean power. Weak finances at the distribution level slow every transition plan.

## A sensible sequence

- **Build the grid first.** Transmission and storage should be planned before the generation that depends on them.
- **Use coal for balancing, not baseload.** Older plants can be run more flexibly while new clean capacity comes in. New coal capacity should be limited to what the plan truly needs.
- **Plan a just transition.** Coal-dependent districts need new industry, retraining and a share of local revenue, announced years ahead.
- **Fix distribution finances.** Timely payments and honest tariffs make long-term clean power contracts bankable.
- **Grow domestic manufacturing.** Supply chains for panels, batteries and electrolysers reduce the risk of replacing a fuel import with an equipment import.

## Conclusion

The transition is a question of order, not of choice. Grids, storage and finances need to move before coal is retired, and workers need a plan before plants close. Done in that order, India can protect energy security and meet its climate goals together. Done out of order, it can end up with higher bills, stranded assets and unhappy regions.
"""
