  "James Prinsep deciphered the Brahmi script in 1837, which opened the Ashokan edicts for reading.",
  "Most edicts are in Prakrit written in Brahmi. Those at Shahbazgarhi and Mansehra in the north-west use Kharosthi, and those near Kandahar use Greek and Aramaic.",
  "The edicts call the king Devanampiya Piyadasi, which means beloved of the gods.",
  "The Archaeological Survey of India was founded in 1861 with Alexander Cunningham as its first Director General.",
]
trap = "Ashoka's name appears in only a few edicts. Most use his titles, which is why the identification with Ashoka took time."

[story.question]
id = "ca-2026-11-10-4"
stem = "The Ashokan inscriptions in the north-western part of the subcontinent were mainly written in which script?"
options = ["Kharosthi", "Brahmi", "Grantha", "Devanagari"]
answer = "A"
explanation = "Edicts in the north-west, such as those at Shahbazgarhi and Mansehra, use Kharosthi, which runs right to left. Most other edicts use Brahmi."

