# The UPSC Civil Services Examination syllabus, as a tree.
#
# Levels: stage (Prelims, Mains) > paper > subject > chapter > topic > subtopic.
# `official` is UPSC's own wording, from Examination Notice No. 05/2026-CSE
# (Appendix I, Section III), on every node that matches a line of the official
# syllabus. Everything below those lines is our breakdown, cross-checked
# against the subject-wise syllabus guides of several UPSC institutes.
# The optional subjects (Mains papers VI and VII) are not included yet.
#
# Tagging: give each note, question and story the most specific nodes it
# covers. A note covers everything under the nodes it is tagged with, so a note
# on a whole chapter is tagged with the chapter. Tag the Mains node and the
# Prelims node when both apply.
#
# Content points at these ids, so keep them stable: a title can change freely,
# an id only together with every file that uses it.

