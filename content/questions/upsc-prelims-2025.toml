[[question]]
id = "upsc-2025-085"
topics = ["pre.gs.environment.pollution.air-pollution-and-the-air"]
source = "UPSC Prelims 2025"
stem = """
Artificial way of causing rainfall to reduce air pollution makes use of"""
options = ["silver iodide and potassium iodide", "silver nitrate and potassium iodide", "silver iodide and potassium nitrate", "silver nitrate and silver chloride"]
answer = "A"
explanation = "Cloud seeding uses silver iodide and potassium iodide, whose crystals act as nuclei around which water droplets condense and fall as rain. Silver nitrate and potassium nitrate are not used as seeding agents."
trap = "The names of the silver and potassium compounds are similar, so the nitrates can look right."

[[question]]
id = "upsc-2025-086"
topics = ["pre.gs.polity.union.president.veto-ordinance-and-pardoning-powers"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements with regard to pardoning power of the President of India:

- I. The exercise of this power by the President can be subjected to limited judicial review.
- II. The President can exercise this power without the advice of the Central Government.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "A"
explanation = "The Supreme Court has held that the pardoning power can be reviewed on limited grounds such as arbitrariness or mala fides. The President must act on the advice of the Council of Ministers, so statement II is wrong."
trap = "Because the power is written as the President's own, it is easy to forget that it is exercised on ministerial advice."
note = "polity-president-vice-president"

[[question]]
id = "upsc-2025-087"
topics = ["pre.gs.polity.parliament.composition-and-the-presiding-officers"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. On the dissolution of the House of the People, the Speaker shall not vacate his/her office until immediately before the first meeting of the House of the People after the dissolution.
- II. According to the provisions of the Constitution of India, a Member of the House of the People on being elected as Speaker shall resign from his/her political party immediately.
- III. The Speaker of the House of the People may be removed from his/her office by a resolution of the House of the People passed by a majority of all the then Members of the House, provided that no resolution shall be moved unless at least fourteen days' notice has been given of the intention to move the resolution.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "C"
explanation = "Article 94 keeps the Speaker in office until just before the new House meets, and sets the removal rule of a majority of all members with 14 days' notice. The Constitution does not require a Speaker to resign from the party; that is only a convention."
trap = "The convention of Speaker neutrality is so strong that it is easy to assume it is a constitutional requirement."
note = "polity-parliament"

[[question]]
id = "upsc-2025-088"
topics = ["pre.gs.polity.parliament.anti-defection-law"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. If any question arises as to whether a Member of the House of the People has become subject to disqualification under the 10th Schedule, the President's decision in accordance with the opinion of the Council of Union Ministers shall be final.
- II. There is no mention of the word 'political party' in the Constitution of India.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "D"
explanation = "Under the Tenth Schedule it is the presiding officer of the House, the Speaker for the Lok Sabha, who decides disqualification, and that decision is subject to judicial review. The Tenth Schedule itself uses the term political party, so statement II is wrong."
trap = "Disqualification on other grounds is decided by the President on the Election Commission's advice, which can be wrongly extended to defection cases."
note = "polity-parliament"

[[question]]
id = "upsc-2025-089"
topics = ["pre.gs.indian-geography.resources.metallic-and-non-metallic-minerals"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

In India, State Governments have no power for making rules for grant of concessions in respect of extraction of minor minerals even though such minerals are located in their territories.

**Statement II :**

In India, the Central Government has the power to notify minor minerals under the relevant law.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "D"
explanation = "Under the Mines and Minerals Act, the Central Government notifies which minerals are minor, but State Governments make the rules for granting concessions for them. Statement I is therefore wrong and Statement II is correct."
trap = "Notifying a mineral as minor and regulating its extraction are separate powers, held by the Centre and the States respectively."

[[question]]
id = "upsc-2025-090"
topics = ["pre.gs.current.environment.environmental-laws-rules-and-judgments"]
source = "UPSC Prelims 2025"
stem = """
Which organization has enacted the Nature Restoration Law (NRL) to tackle climate change and biodiversity loss?"""
options = ["The European Union", "The World Bank", "The Organization for Economic Cooperation and Development", "The Food and Agriculture Organization"]
answer = "A"
explanation = "The European Union adopted the Nature Restoration Law in 2024, setting binding targets to restore degraded ecosystems across its member states. The World Bank, OECD and FAO cannot enact binding laws of this kind."
