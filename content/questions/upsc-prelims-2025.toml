note = "polity-amendment-basic-structure"

[[question]]
id = "upsc-2025-059"
topics = ["pre.gs.polity.states.governor", "pre.gs.polity.parliament.parliamentary-privileges"]
source = "UPSC Prelims 2025"
stem = """
With reference to the Indian polity, consider the following statements:

- I. The Governor of a State is not answerable to any court for the exercise and performance of the powers and duties of his/her office.
- II. No criminal proceedings shall be instituted or continued against the Governor during his/her term of office.
- III. Members of a State Legislature are not liable to any proceedings in any court in respect of anything said within the House.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "D"
explanation = "Article 361 gives the Governor immunity from court answerability for official acts and bars criminal proceedings during the term. Article 194 protects legislators from court proceedings for what they say in the House."
trap = "The immunity for the Governor is partial, as civil suits can be filed after two months' notice, but the criminal-proceedings bar holds."
note = "polity-state-executive"

[[question]]
id = "upsc-2025-060"
topics = ["pre.gs.indian-geography.resources.coal-petroleum-and-natural-gas"]
source = "UPSC Prelims 2025"
stem = """
Consider the following activities:

- I. Production of crude oil
- II. Refining, storage and distribution of petroleum
- III. Marketing and sale of petroleum products
- IV. Production of natural gas

How many of the above activities are regulated by the Petroleum and Natural Gas Regulatory Board in our country?"""
options = ["Only one", "Only two", "Only three", "All the four"]
answer = "B"
explanation = "The PNGRB regulates refining, processing, storage, transportation, distribution, marketing and sale of petroleum, petroleum products and natural gas. Upstream production of crude oil and natural gas is outside its remit."
trap = "The word 'petroleum' in the board's name suggests it covers all stages, but upstream production is excluded."

[[question]]
id = "upsc-2025-061"
topics = ["pre.gs.economy.fiscal.deficits"]
source = "UPSC Prelims 2025"
stem = """
Suppose the revenue expenditure is ₹ 80,000 crores and the revenue receipts of the Government are ₹ 60,000 crores. The Government budget also shows borrowings of ₹ 10,000 crores and interest payments of ₹ 6,000 crores. Which of the following statements are correct?

- I. Revenue deficit is ₹ 20,000 crores.
- II. Fiscal deficit is ₹ 10,000 crores.
- III. Primary deficit is ₹ 4,000 crores.

Select the correct answer using the code given below."""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "D"
explanation = "Revenue deficit is revenue expenditure minus revenue receipts, 80,000 − 60,000 = 20,000. Fiscal deficit equals total borrowing, 10,000, and primary deficit is fiscal deficit minus interest payments, 10,000 − 6,000 = 4,000."
trap = "The large revenue deficit can make the fiscal deficit look inconsistent, but the question gives borrowings directly, and those equal the fiscal deficit."

[[question]]
id = "upsc-2025-062"
topics = ["pre.gs.current.international.indias-bilateral-visits-and-agreements"]
source = "UPSC Prelims 2025"
stem = """
India is one of the founding members of the International North-South Transport Corridor (INSTC), a multimodal transportation corridor, which will connect"""
options = ["India to Central Asia to Europe via Iran", "India to Central Asia via China", "India to South-East Asia through Bangladesh and Myanmar", "India to Europe through Azerbaijan"]
answer = "A"
explanation = "The INSTC links the Indian Ocean and the Persian Gulf to the Caspian Sea through Iran and onward to Russia and northern Europe, with Central Asian links. It is meant to cut transport time and cost between India and Europe."
trap = "Azerbaijan is on the route, but the corridor runs through Iran, so the Azerbaijan-only option is incomplete."

[[question]]
id = "upsc-2025-063"
topics = ["pre.gs.environment.energy.biofuels-and-green-hydrogen", "pre.gs.indian-geography.resources.nuclear-and-renewable-energy"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Of the two major ethanol producers in the world, i.e., Brazil and the United States of America, the former produces more ethanol than the latter.

**Statement II :**

Unlike in the United States of America where corn is the principal feedstock for ethanol production, sugarcane is the principal feedstock for ethanol production in Brazil.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "D"
explanation = "The United States is the world's largest ethanol producer, ahead of Brazil, so Statement I is false. Statement II is true: Brazil mainly uses sugarcane while the US uses corn."
trap = "Brazil's ethanol programme is more famous, which makes it seem the larger producer."

[[question]]
id = "upsc-2025-064"
topics = ["pre.gs.current.international.international-organisations-and-their-reports", "pre.gs.environment.climate-change.global-warming-and-its-impacts"]
source = "UPSC Prelims 2025"
stem = """
The World Bank warned that India could become one of the first places where wet-bulb temperatures routinely exceed 35 °C. Which of the following statements best reflect(s) the implication of the above-said report?

- I. Peninsular India will most likely suffer from flooding, tropical cyclones and droughts.
- II. The survival of animals including humans will be affected as shedding of their body heat through perspiration becomes difficult.

Select the correct answer using the code given below."""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "C"
explanation = "Above a wet-bulb temperature of 35 degrees Celsius the body cannot cool itself by sweating, which threatens the survival of humans and animals. Under the same warming, the peninsula is also exposed to more floods, cyclones and droughts. Both implications fit the report."
trap = "Wet-bulb heat is mainly about body heat loss, so one may leave out the wider extreme-weather risks in statement I."

[[question]]
id = "upsc-2025-065"
topics = ["pre.gs.economy.fiscal.deficits"]
source = "UPSC Prelims 2025"
stem = """
A country's fiscal deficit stands at ₹ 50,000 crores. It is receiving ₹ 10,000 crores through non-debt creating capital receipts. The country's interest liabilities are ₹ 1,500 crores. What is the gross primary deficit?"""
options = ["₹ 48,500 crores", "₹ 51,500 crores", "₹ 58,500 crores", "None of the above"]
answer = "A"
explanation = "Gross primary deficit is the gross fiscal deficit minus interest payments, 50,000 − 1,500 = 48,500 crores. Non-debt capital receipts are already counted in arriving at the fiscal deficit, so they are not subtracted again."
trap = "The ₹ 10,000 crore of non-debt receipts is a distractor that tempts a second subtraction."

[[question]]
id = "upsc-2025-066"
topics = ["pre.gs.economy.fiscal.finance-commission-and-fiscal-federalism", "pre.gs.polity.constitutional-bodies.finance-commission"]
source = "UPSC Prelims 2025"
stem = """
Which of the following statements with regard to recommendations of the 15th Finance Commission of India are correct?

- I. It has recommended grants of ₹ 4,800 crores from the year 2022-23 to the year 2025-26 for incentivizing States to enhance educational outcomes.
- II. 45% of the net proceeds of Union taxes are to be shared with States.
- III. ₹ 45,000 crores are to be kept as performance-based incentive for all States for carrying out agricultural reforms.
- IV. It reintroduced tax effort criteria to reward fiscal performance.

Select the correct answer using the code given below."""
options = ["I, II and III", "I, II and IV", "I, III and IV", "II, III and IV"]
answer = "C"
explanation = "The 15th Finance Commission recommended the education outcome grant, performance incentives for agricultural reforms and a tax effort criterion in the devolution formula. It kept the States' share of divisible taxes at 41 per cent, not 45 per cent."
trap = "The 14th Commission raised the share to 42 per cent, and 45 per cent sounds like a natural next step, but it did not happen."
note = "polity-centre-state-fiscal"

[[question]]
id = "upsc-2025-067"
topics = ["pre.gs.economy.international.imf-and-the-world-bank"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements in respect of the International Bank for Reconstruction and Development (IBRD):

- I. It provides loans and guarantees to middle income countries.
- II. It works single-handedly to help developing countries to reduce poverty.
- III. It was established to help Europe rebuild after the World War II."""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "C"
explanation = "The IBRD lends to and guarantees for middle-income and creditworthy poorer countries, and it was set up in 1944 to finance post-war reconstruction of Europe. It works with the other World Bank institutions such as IDA, not single-handedly."
trap = "'Single-handedly' in statement II is the giveaway, as the World Bank Group works through several institutions."

[[question]]
id = "upsc-2025-068"
topics = ["pre.gs.economy.money.payment-systems-and-digital-payments"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements in respect of RTGS and NEFT:

- I. In RTGS, the settlement time is instantaneous while in case of NEFT, it takes some time to settle payments.
- II. In RTGS, the customer is charged for inward transactions while that is not the case for NEFT.
- III. Operating hours for RTGS are restricted on certain days while this is not true for NEFT.

Which of the statements given above is/are correct?"""
options = ["I only", "I and II", "I and III", "III only"]
answer = "A"
explanation = "RTGS settles each payment individually in real time, whereas NEFT settles in batches. Receiving customers are not charged for inward RTGS or NEFT transactions, and both systems now run round the clock."
trap = "Operating hours were once restricted for both systems; since they are now 24x7, a hours-based difference no longer exists."

[[question]]
id = "upsc-2025-069"
topics = ["pre.gs.economy.money.payment-systems-and-digital-payments"]
source = "UPSC Prelims 2025"
stem = """
Consider the following countries:

- I. United Arab Emirates
- II. France
- III. Germany
- IV. Singapore
- V. Bangladesh

How many countries amongst the above are there other than India where international merchant payments are accepted under UPI?"""
options = ["Only two", "Only three", "Only four", "All the five"]
answer = "B"
explanation = "At the time of the paper, UPI merchant payments were accepted abroad in the United Arab Emirates, France and Singapore among the countries listed. Germany and Bangladesh were not accepting them."
trap = "UPI's reach is often said to be spreading across Europe, which can make Germany sound plausible."

[[question]]
id = "upsc-2025-070"
topics = ["pre.gs.current.schemes.missions-and-flagship-programmes", "pre.gs.environment.energy.solar-wind-and-hydro-energy"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements about 'PM Surya Ghar Muft Bijli Yojana':

- I. It targets installation of one crore solar rooftop panels in the residential sector.
- II. The Ministry of New and Renewable Energy aims to impart training on installation, operation, maintenance and repairs of solar rooftop systems at grassroot levels.
- III. It aims to create more than three lakhs skilled manpower through fresh skilling, and up-skilling, under scheme component of capacity building.

Which of the statements given above are correct?"""
options = ["I and II only", "I and III only", "II and III only", "I, II and III"]
answer = "D"
explanation = "The scheme, launched in 2024, aims to put rooftop solar on one crore households. It includes a capacity-building component under the Ministry of New and Renewable Energy to train and skill more than three lakh people. All three statements match the scheme."
trap = "Statement I says 'solar rooftop panels' while the scheme counts households, but the statement still reflects its one-crore target."

[[question]]
id = "upsc-2025-071"
topics = ["pre.gs.modern.gandhian.purna-swaraj-and-the-civil"]
source = "UPSC Prelims 2025"
stem = """
"Sedition has become my religion" was the famous statement given by Gandhiji at the time of"""
options = ["the Champaran Satyagraha", "publicly violating Salt Law at Dandi", "attending the Second Round Table Conference in London", "the launch of the Quit India Movement"]
answer = "B"
explanation = "UPSC's key places this statement at the time of the Salt Satyagraha, when Gandhi defied the salt law at Dandi in 1930. The Civil Disobedience Movement was an open challenge to colonial law, which is why he spoke of sedition as a duty."
trap = "'Do or Die' belongs to Quit India, so the dramatic phrase is easily attached to the wrong movement."

[[question]]
id = "upsc-2025-072"
topics = ["pre.gs.ancient.ivc.seals-sculpture-and-pottery"]
source = "UPSC Prelims 2025"
stem = """
The famous female figurine known as 'Dancing Girl', found at Mohenjo-daro, is made of"""
options = ["carnelian", "clay", "bronze", "gold"]
answer = "C"
explanation = "The Dancing Girl is a small bronze statue made by the lost-wax method. It is a leading example of Harappan metal casting."
trap = "Harappan figurines are mostly terracotta, which makes clay the tempting choice."

[[question]]
id = "upsc-2025-073"
topics = ["pre.gs.modern.gandhian.khilafat-and-non-cooperation-movements"]
source = "UPSC Prelims 2025"
stem = """
Who provided legal defence to the people arrested in the aftermath of Chauri Chaura incident?"""
options = ["C. R. Das", "Madan Mohan Malaviya and Krishna Kant", "Dr. Saifuddin Kitchlew and Khwaja Hasan Nizami", "M. A. Jinnah"]
answer = "B"
explanation = "Madan Mohan Malaviya led the defence of the Chauri Chaura accused before the Allahabad High Court, which reduced the number of death sentences. The other names are associated with different legal and political episodes."
trap = "C. R. Das is famed as a lawyer in freedom-struggle trials, but the Chauri Chaura defence is credited to Malaviya."

[[question]]
id = "upsc-2025-074"
topics = ["pre.gs.modern.gandhian.communal-award-and-poona-pact"]
source = "UPSC Prelims 2025"
stem = """
Subsequent to which one of the following events, Gandhiji, who consistently opposed untouchability and appealed for its eradication from all spheres, decided to include the upliftment of 'Harijans' in his political and social programme?"""
options = ["The Poona Pact", "The Gandhi-Irwin Agreement (Delhi Pact)", "Arrest of Congress leadership at the time of the Quit India Movement", "Promulgation of the Government of India Act, 1935"]
answer = "A"
explanation = "After the Poona Pact of September 1932 ended the separate electorate for the Depressed Classes, Gandhi founded the Harijan Sevak Sangh and launched a campaign against untouchability. The campaign became part of his regular programme from then on."
trap = "Gandhi had opposed untouchability long before 1932, so the question asks when it became a formal part of his programme."

[[question]]
id = "upsc-2025-075"
topics = ["pre.gs.modern.europeans.portuguese"]
source = "UPSC Prelims 2025"
stem = """
Consider the following fruits:

- I. Papaya
- II. Pineapple
- III. Guava

How many of the above were introduced in India by the Portuguese in the sixteenth and seventeenth centuries?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Papaya, pineapple and guava are all New World fruits that reached India through the Portuguese. They were introduced in the sixteenth and seventeenth centuries along with crops such as potato, chilli and tobacco."
trap = "These fruits are now so common in India that one assumes they are native."

[[question]]
id = "upsc-2025-076"
topics = ["pre.gs.physical-geography.earth.latitudes-longitudes-and-time-zones"]
source = "UPSC Prelims 2025"
stem = """
Consider the following countries:

- I. United Kingdom
- II. Denmark
- III. New Zealand
- IV. Australia
- V. Brazil

How many of the above countries have more than four time zones?"""
options = ["All the five", "Only four", "Only three", "Only two"]
answer = "B"
explanation = "Counting their overseas territories, the United Kingdom, Denmark, New Zealand and Australia each span more than four time zones. Brazil has exactly four, so it is the one that does not exceed four."
trap = "Brazil is a vast country, but the territories of the smaller-looking European states are what add zones."

[[question]]
id = "upsc-2025-077"
topics = ["pre.gs.physical-geography.earth.latitudes-longitudes-and-time-zones"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. Anadyr in Siberia and Nome in Alaska are a few kilometers from each other, but when people are waking up and getting set for breakfast in these cities, it would be different days.
- II. When it is Monday in Anadyr, it is Tuesday in Nome."""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "A"
explanation = "The International Date Line runs between the two places, with Anadyr on the western, earlier-date side. When it is Monday in Anadyr it is still Sunday in Nome, so statement II reverses the order."
trap = "Moving east across the date line sets the calendar back a day, so the eastern city is behind, not ahead."

[[question]]
id = "upsc-2025-078"
topics = ["pre.gs.modern.personalities.leaders-from-different-regions"]
source = "UPSC Prelims 2025"
stem = """
Who among the following was the founder of the 'Self-Respect Movement'?"""
options = ["'Periyar' E. V. Ramaswamy Naicker", "Dr. B. R. Ambedkar", "Bhaskarrao Jadhav", "Dinkarrao Javalkar"]
answer = "A"
explanation = "E. V. Ramaswamy Naicker, known as Periyar, started the Self-Respect Movement in Tamil Nadu in 1925 to fight caste hierarchy and Brahminical dominance. The other three names are linked with non-Brahmin movements in Maharashtra."
trap = "Ambedkar led several Dalit movements, but the Self-Respect Movement is Periyar's."

[[question]]
id = "upsc-2025-079"
topics = ["pre.gs.world-geography.resources.minerals-and-energy-resources"]
source = "UPSC Prelims 2025"
stem = """
Consider the following pairs:

| Country | Resource-rich in |
|---|---|
| I. Botswana | Diamond |
| II. Chile | Lithium |
| III. Indonesia | Nickel |

In how many of the above rows is the given information correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Botswana is a major diamond producer, Chile holds large lithium reserves, and Indonesia is the world's largest nickel producer. All three pairs are correct."
trap = "Lithium is often linked with Australia or Bolivia, but Chile is also among the top reserve holders."

[[question]]
id = "upsc-2025-080"
topics = ["pre.gs.world-geography.regions.europe"]
source = "UPSC Prelims 2025"
stem = """
