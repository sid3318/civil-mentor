| Region | Country |
|---|---|
| I. Mallorca | Italy |
| II. Normandy | Spain |
| III. Sardinia | France |

In how many of the above rows is the given information correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "D"
explanation = "Mallorca belongs to Spain, Normandy to France and Sardinia to Italy. Each row gives the wrong country, so none is correctly matched."
trap = "The three Mediterranean and Atlantic regions are easy to shuffle among their neighbours."

[[question]]
id = "upsc-2025-081"
topics = ["pre.gs.world-geography.resources.minerals-and-energy-resources"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Some rare earth elements are used in the manufacture of flat television screens and computer monitors.

**Statement II :**

Some rare earth elements have phosphorescent properties.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "A"
explanation = "Rare earth elements such as europium and terbium act as phosphors that glow when excited, which is why they are used in display screens and monitors. The property in Statement II is the reason for the use in Statement I."
trap = "Rare earths are best known for magnets and batteries, so their role in displays is easily overlooked."

[[question]]
id = "upsc-2025-082"
topics = ["pre.gs.indian-geography.transport.railways-and-dedicated-freight-corridors"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. Indian Railways have prepared a National Rail Plan (NRP) to create a 'future ready' railway system by 2028.
- II. 'Kavach' is an Automatic Train Protection system developed in collaboration with Germany.
- III. 'Kavach' system consists of RFID tags fitted on track in station section.

Which of the statements given above are **not** correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "A"
explanation = "The National Rail Plan targets a future-ready system by 2030, not 2028, and Kavach is an indigenous system developed by the Research Designs and Standards Organisation with Indian industry. Kavach does use RFID tags on the track, so statement III is correct and therefore not part of the answer."
trap = "The question asks for statements that are not correct, so the true statement III must be excluded."

[[question]]
id = "upsc-2025-083"
topics = ["pre.gs.science-tech.space.indian-space-missions", "pre.gs.science-tech.space.international-missions-and-space-telescopes"]
source = "UPSC Prelims 2025"
stem = """
Consider the following space missions:

- I. Axiom-4
- II. SpaDeX
- III. Gaganyaan

How many of the space missions given above encourage and support micro-gravity research?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "B"
explanation = "UPSC's final key counts two of the three missions as supporting microgravity research. Axiom-4 clearly does, since it carried experiments to be run in microgravity on the space station."
trap = "Missions built mainly to demonstrate a technology, such as docking, are easy to count in or out wrongly."

[[question]]
id = "upsc-2025-084"
topics = ["pre.gs.science-tech.defence.aircraft-ships-and-submarines"]
source = "UPSC Prelims 2025"
stem = """
With reference to India's defence, consider the following pairs:

| Aircraft type | Description |
|---|---|
| I. Dornier-228 | Maritime patrol aircraft |
| II. IL-76 | Supersonic combat aircraft |
| III. C-17 Globemaster III | Military transport aircraft |

How many of the pairs given above are correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
