[[question]]
id = "upsc-2025-023"
topics = ["pre.gs.world-geography.features.rivers-lakes-and-waterfalls", "pre.gs.physical-geography.earth.latitudes-longitudes-and-time-zones"]
source = "UPSC Prelims 2025"
stem = """
Consider the following water bodies:

- I. Lake Tanganyika
- II. Lake Tonlé Sap
- III. Patos Lagoon

Through how many of them does the equator pass?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "D"
explanation = "Lake Tanganyika lies south of the equator, between about 3 and 9 degrees south. Tonlé Sap in Cambodia is around 13 degrees north and Patos Lagoon in southern Brazil is around 31 degrees south, so the equator crosses none of them."
trap = "The equator does cross Lake Victoria, which sits next to Tanganyika on the map, so the neighbouring lake gets wrongly included."

[[question]]
id = "upsc-2025-024"
topics = ["pre.gs.indian-geography.agriculture.major-crops-and-their-distribution"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements about turmeric during the year 2022-23:

- I. India is the largest producer and exporter of turmeric in the world.
- II. More than 30 varieties of turmeric are grown in India.
- III. Maharashtra, Telangana, Karnataka and Tamil Nadu are major turmeric producing States in India.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "D"
explanation = "India is the world's leading producer and exporter of turmeric, grows more than 30 varieties, and the four listed States are among its main producers. All three statements hold."
trap = "A statement that looks like trivia is not necessarily a trick; here every line is correct."

[[question]]
id = "upsc-2025-025"
topics = ["pre.gs.physical-geography.tectonics.continental-drift-theory"]
source = "UPSC Prelims 2025"
stem = """
Which of the following are the evidences of the phenomenon of continental drift?

- I. The belt of ancient rocks from Brazil coast matches with those from Western Africa.
- II. The gold deposits of Ghana are derived from the Brazil plateau when the two continents lay side by side.
- III. The Gondwana system of sediments from India is known to have its counterparts in six different landmasses of the Southern Hemisphere.

Select the correct answer using the code given below."""
options = ["I and III only", "I and II only", "I, II and III", "II and III only"]
answer = "C"
explanation = "Matching rock belts across the Atlantic, the placer gold of Ghana traced to the Brazilian plateau, and Gondwana sediments found on six southern landmasses are all standard evidences cited for continental drift. All three therefore count."
trap = "Gold deposits seem too odd to be 'evidence', but the Ghana-Brazil link is a classic example."

[[question]]
id = "upsc-2025-026"
topics = ["pre.gs.physical-geography.climatology.composition-and-structure"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

The amount of dust particles in the atmosphere is more in subtropical and temperate areas than in equatorial and polar regions.

**Statement II :**

Subtropical and temperate areas have less dry winds.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "C"
explanation = "Dust is more abundant over the subtropical and temperate belts because dry winds blow over their deserts and dry land. So Statement II, which says these areas have less dry winds, is false."
trap = "Statement II is the exact reverse of the cause, so a quick read of both as 'true and linked' leads to option A."

[[question]]
id = "upsc-2025-027"
topics = ["pre.gs.physical-geography.climatology.temperature-distribution-and-inversion"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

In January, in the Northern Hemisphere, the isotherms bend equatorward while crossing the landmasses, and poleward while crossing the oceans.

**Statement II :**

In January, the air over the oceans is warmer than that over the landmasses in the Northern Hemisphere.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "A"
explanation = "In northern winter the oceans hold heat better than land, so the air over them is warmer. That makes isotherms swing poleward over oceans and equatorward over cold landmasses, which is exactly what Statement I describes."
trap = "In July the pattern reverses, so memorising only the summer picture gives the wrong direction."

[[question]]
id = "upsc-2025-028"
topics = ["pre.gs.physical-geography.rocks.igneous-sedimentary-and-metamorphic-rocks"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

In the context of effect of water on rocks, chalk is known as a very permeable rock whereas clay is known as quite an impermeable or least permeable rock.

**Statement II :**

Chalk is porous and hence can absorb water.

**Statement III :**

Clay is not at all porous.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "C"
explanation = "Chalk is porous and its open pores let water move through, which explains why it is permeable. Clay is porous too, but its pores are so tiny that water cannot pass, so it is impermeable; Statement III is false."
trap = "'Impermeable' is easily confused with 'non-porous', but clay holds water in very fine pores."

[[question]]
id = "upsc-2025-029"
topics = ["pre.gs.physical-geography.climatology.insolation-and-heat-budget", "pre.gs.environment.climate-change.greenhouse-effect-and-greenhouse-gases"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. Without the atmosphere, temperature would be well below freezing point everywhere on the Earth's surface.
- II. Heat absorbed and trapped by the atmosphere maintains our planet's average temperature.
- III. Atmosphere's gases, like carbon dioxide, are particularly good at absorbing and trapping radiation.

Which of the statements given above are correct?"""
options = ["I and III only", "I and II only", "I, II and III", "II and III only"]
answer = "C"
explanation = "Greenhouse gases such as carbon dioxide absorb outgoing radiation and keep the average surface temperature near 15 degrees Celsius. Without that natural greenhouse effect, the surface would average around minus 18 degrees, below freezing everywhere."
trap = "Because 'greenhouse effect' is associated with warming problems, one may doubt that it is also what makes the Earth habitable."

[[question]]
id = "upsc-2025-030"
topics = ["pre.gs.indian-geography.agriculture.animal-husbandry-and-fisheries", "pre.gs.current.schemes.central-sector-and-centrally-sponsored"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements about the Rashtriya Gokul Mission:

- I. It is important for the upliftment of rural poor as majority of low producing indigenous animals are with small and marginal farmers and landless labourers.
- II. It was initiated to promote indigenous cattle and buffalo rearing and conservation in a scientific and holistic manner.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "C"
explanation = "The Rashtriya Gokul Mission, started in 2014, aims to conserve and develop indigenous cattle and buffalo breeds scientifically. Most of these animals are held by small and marginal farmers and landless labourers, which is why it matters for the rural poor."
trap = "Statement I reads like a justification rather than a fact, but it is the stated rationale of the mission."

[[question]]
id = "upsc-2025-031"
topics = ["pre.gs.indian-geography.industries.iron-and-steel-textiles-cement", "pre.gs.environment.climate-change.greenhouse-effect-and-greenhouse-gases"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Studies indicate that carbon dioxide emissions from cement industry account for more than 5% of global carbon emissions.

**Statement II :**

Silica-bearing clay is mixed with limestone while manufacturing cement.

**Statement III :**

Limestone is converted into lime during clinker production for cement manufacturing.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "B"
explanation = "Both statements are true. Heating limestone into lime in the kiln releases carbon dioxide directly, which helps explain the industry's large emissions share. Mixing clay with limestone is just a raw-material step and does not explain the emissions."
trap = "All three lines are true, so the real test is spotting which one actually explains the first."

[[question]]
id = "upsc-2025-032"
topics = ["pre.gs.current.environment.climate-summits-and-negotiations"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

At the 28th United Nations Climate Change Conference (COP28), India refrained from signing the 'Declaration on Climate and Health'.

**Statement II :**

The COP28 Declaration on Climate and Health is a binding declaration; and if signed, it becomes mandatory to decarbonize health sector.

**Statement III :**

If India's health sector is decarbonized, the resilience of its health-care system may be compromised.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "C"
explanation = "India did not sign the declaration, and the stated worry was that decarbonising the health sector could weaken the resilience of its health-care system, which explains the refusal. The declaration is voluntary and not binding, so Statement II is false."
trap = "Calling a COP declaration 'binding' is the common slip; these are political declarations, not treaties."

[[question]]
id = "upsc-2025-033"
topics = ["pre.gs.physical-geography.earth.shape-size-and-motions", "pre.gs.environment.climate-change.global-warming-and-its-impacts"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Scientific studies suggest that a shift is taking place in the Earth's rotation and axis.

**Statement II :**

Solar flares and associated coronal mass ejections bombarded the Earth's outermost atmosphere with tremendous amount of energy.

**Statement III :**

As the Earth's polar ice melts, the water tends to move towards the equator.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "B"
explanation = "Both statements are true. Meltwater flowing towards the equator redistributes the Earth's mass, which can shift its rotation and axis, so Statement III explains Statement I. Solar flares hitting the upper atmosphere are real but do not move the axis."
trap = "A dramatic solar event sounds like a cause for a planetary shift, but it adds energy to the atmosphere, not a change in mass distribution."

[[question]]
id = "upsc-2025-034"
topics = ["pre.gs.environment.conventions.unfccc-kyoto-protocol", "pre.gs.environment.climate-change.mitigation"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Article 6 of the Paris Agreement on climate change is frequently discussed in global discussions on sustainable development and climate change.

**Statement II :**

Article 6 of the Paris Agreement on climate change sets out the principles of carbon markets.

**Statement III :**

Article 6 of the Paris Agreement on climate change intends to promote inter-country non-market strategies to reach their climate targets.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "A"
explanation = "Article 6 provides for cooperation between countries through both market mechanisms such as carbon credit trading and non-market approaches. Because it covers both routes to meeting national targets, it comes up often in climate and sustainable development talks."
trap = "'Non-market' in Statement III looks like a contradiction with carbon markets, but Article 6 covers both."

[[question]]
id = "upsc-2025-035"
topics = ["pre.gs.economy.international.new-development-bank-and-aiib", "pre.gs.environment.climate-change.adaptation-and-climate-finance"]
source = "UPSC Prelims 2025"
stem = """
Which one of the following launched the 'Nature Solutions Finance Hub for Asia and the Pacific'?"""
options = ["The Asian Development Bank (ADB)", "The Asian Infrastructure Investment Bank (AIIB)", "The New Development Bank (NDB)", "The International Bank for Reconstruction and Development (IBRD)"]
answer = "A"
explanation = "The Asian Development Bank launched the hub to channel finance into nature-based solutions in the region. It is a current-affairs fact about the ADB's climate and nature finance work."
trap = "AIIB and the World Bank also run climate finance, which makes them plausible but wrong."

[[question]]
id = "upsc-2025-036"
topics = ["pre.gs.environment.climate-change.mitigation"]
source = "UPSC Prelims 2025"
stem = """
With reference to 'Direct Air Capture', an emerging technology, which of the following statements is/are correct?

- I. It can be used as a way of carbon sequestration.
- II. It can be a valuable approach for plastic production and in food processing.
- III. In aviation, it can be a source of carbon for combining with hydrogen to create synthetic low-carbon fuel.

Select the correct answer using the code given below."""
options = ["I and II only", "III only", "I, II and III", "None of the above statements is correct"]
answer = "C"
explanation = "Direct air capture pulls carbon dioxide from ambient air, so the carbon can be stored underground or used as a feedstock. Uses include plastics, food and beverage processing, and synthetic aviation fuel made by combining the captured carbon with hydrogen."
trap = "It is usually described only as sequestration, but captured carbon is also a raw material for products and fuels."

[[question]]
id = "upsc-2025-037"
topics = ["pre.gs.environment.biodiversity.iucn-red-list-categories", "pre.gs.current.environment.species-in-the-news"]
source = "UPSC Prelims 2025"
stem = """
Regarding Peacock tarantula (Gooty tarantula), consider the following statements:

- I. It is an omnivorous crustacean.
- II. Its natural habitat in India is only limited to some forest areas.
- III. In its natural habitat, it is an arboreal species.

Which of the statements given above is/are correct?"""
options = ["I only", "I and III", "II only", "II and III"]
answer = "D"
explanation = "The Gooty tarantula is a spider, an arachnid that feeds on insects, so it is not a crustacean. It is a critically endangered species found only in a small forest patch in Andhra Pradesh, and it lives in trees."
trap = "'Tarantula' might suggest a ground burrower and an animal like a crab, but this species is an arboreal spider."

[[question]]
id = "upsc-2025-038"
topics = ["pre.gs.environment.climate-change.indias-climate-actions"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. Carbon dioxide (CO2) emissions in India are less than 0·5 t CO2/capita.
- II. In terms of CO2 emissions from fuel combustion, India ranks second in Asia-Pacific region.
- III. Electricity and heat producers are the largest sources of CO2 emissions in India.

Which of the statements given above is/are correct?"""
options = ["I and III only", "II only", "II and III only", "I, II and III"]
answer = "C"
explanation = "India's per-capita CO2 emissions are around 2 tonnes, well above 0.5 tonne, so statement I is wrong. India is the second largest emitter from fuel combustion in Asia-Pacific after China, and power and heat generation is its biggest emitting sector."
trap = "India's per-capita figure is low compared with the world average, but not as low as the 0.5 tonne in the statement."

[[question]]
id = "upsc-2025-039"
topics = ["pre.gs.general-science.biology.classification-of-living-organisms"]
source = "UPSC Prelims 2025"
stem = """
Consider the following pairs:

| Plant | Description |
|---|---|
| I. Cassava | Woody shrub |
| II. Ginger | Herb with pseudostem |
| III. Malabar spinach | Herbaceous climber |
| IV. Mint | Annual shrub |
| V. Papaya | Woody shrub |

How many of the above pairs are correctly matched?"""
options = ["Only two", "Only three", "Only four", "All the five"]
answer = "B"
explanation = "Cassava is a woody shrub, ginger is a herb whose leaf bases form a pseudostem, and Malabar spinach is a herbaceous climber. Mint is a perennial herb and papaya is a large soft-stemmed herbaceous plant, so the last two pairs do not match."
trap = "Papaya looks like a small tree, but its stem is soft and not truly woody."

[[question]]
id = "upsc-2025-040"
topics = ["pre.gs.environment.ecology.biogeochemical-cycles"]
source = "UPSC Prelims 2025"
stem = """
With reference to the planet Earth, consider the following statements:

- I. Rain forests produce more oxygen than that produced by oceans.
- II. Marine phytoplankton and photosynthetic bacteria produce about 50% of world's oxygen.
- III. Well-oxygenated surface water contains several folds higher oxygen than that in atmospheric air.

Which of the statements given above is/are correct?"""
options = ["I and II", "II only", "I and III", "None of the above statements is correct"]
answer = "B"
explanation = "Oceanic phytoplankton and photosynthetic bacteria produce roughly half of the world's oxygen, more than rain forests do, because forests use up most of what they make. Air holds far more oxygen than even well-oxygenated water, so statement III is false."
trap = "The Amazon is popularly called the lungs of the Earth, which makes statement I tempting."

[[question]]
id = "upsc-2025-041"
topics = ["pre.gs.science-tech.energy-tech.batteries-and-fuel-cells"]
source = "UPSC Prelims 2025"
stem = """
Consider the following types of vehicles:

- I. Full battery electric vehicles
- II. Hydrogen fuel cell vehicles
- III. Fuel cell-electric hybrid vehicles

How many of the above are considered as alternative powertrain vehicles?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Any vehicle that does not rely solely on a conventional petrol or diesel engine counts as an alternative powertrain. Battery electric, hydrogen fuel cell and fuel cell-electric hybrid vehicles all qualify."
trap = "Hybrids can feel like a half-measure, but fuel cell-electric hybrids still have an alternative powertrain."

[[question]]
id = "upsc-2025-042"
topics = ["pre.gs.science-tech.emerging.robotics-and-drones"]
source = "UPSC Prelims 2025"
stem = """
With reference to Unmanned Aerial Vehicles (UAVs), consider the following statements:

- I. All types of UAVs can do vertical landing.
- II. All types of UAVs can do automated hovering.
- III. All types of UAVs can use battery only as a source of power supply.

How many of the statements given above are correct?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "D"
explanation = "Fixed-wing UAVs cannot land vertically or hover, and they often run on fuel engines or hybrid systems rather than batteries alone. Each statement overstates what 'all types' can do, so none is correct."
trap = "Multirotor drones, the most familiar type, do all three, which makes it easy to generalise to every UAV."

[[question]]
id = "upsc-2025-043"
topics = ["pre.gs.science-tech.energy-tech.batteries-and-fuel-cells"]
source = "UPSC Prelims 2025"
stem = """
In the context of electric vehicle batteries, consider the following elements:

- I. Cobalt
- II. Graphite
- III. Lithium
- IV. Nickel

How many of the above usually make up battery cathodes?"""
options = ["Only one", "Only two", "Only three", "All the four"]
answer = "C"
explanation = "Lithium-ion cathodes are typically lithium metal oxides containing cobalt and nickel. Graphite is the usual anode material, not part of the cathode."
trap = "Graphite is a key battery material, which makes it easy to place in the cathode by mistake."

[[question]]
id = "upsc-2025-044"
topics = ["pre.gs.general-science.chemistry.polymers-plastics-and-fibres", "pre.gs.environment.pollution.solid-plastic-electronic-biomedical"]
source = "UPSC Prelims 2025"
stem = """
Consider the following:

- I. Cigarette butts
- II. Eyeglass lenses
- III. Car tyres

How many of them contain plastic?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Cigarette filters are made of cellulose acetate, a plastic. Most eyeglass lenses are plastic polymers, and tyres contain synthetic rubber polymers, so all three contain plastic."
trap = "Filters look like cotton and tyres like rubber, so people forget that both contain synthetic polymers."

[[question]]
id = "upsc-2025-045"
topics = ["pre.gs.indian-geography.resources.coal-petroleum-and-natural-gas"]
source = "UPSC Prelims 2025"
stem = """
Consider the following substances:

- I. Ethanol
- II. Nitroglycerine
- III. Urea

Coal gasification technology can be used in the production of how many of them?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "B"
explanation = "Coal gasification yields synthesis gas, which can be converted into chemicals such as ethanol and ammonia, the base for urea. Nitroglycerine is made from glycerol and nitric acid, so it is not a gasification product."
trap = "Coal gasification is linked to fuels and fertilisers, but explosives like nitroglycerine come from a different route."

[[question]]
id = "upsc-2025-046"
topics = ["pre.gs.general-science.chemistry.chemistry-in-everyday-life", "pre.gs.science-tech.defence.indigenisation"]
source = "UPSC Prelims 2025"
stem = """
What is the common characteristic of the chemical substances generally known as CL-20, HMX and LLM-105, which are sometimes talked about in media?"""
options = ["These are alternatives to hydro-fluorocarbon refrigerants", "These are explosives in military weapons", "These are high-energy fuels for cruise missiles", "These are fuels for rocket propulsion"]
answer = "B"
explanation = "CL-20, HMX and LLM-105 are high-energy explosive compounds used in military munitions. They are explosives that detonate rather than fuels that burn for propulsion."
trap = "'High-energy' suggests propellant, but these compounds are used as explosive fillings."

[[question]]
id = "upsc-2025-047"
topics = ["pre.gs.science-tech.emerging.quantum-technology", "pre.gs.science-tech.emerging.artificial-intelligence-and-machine-learning"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. It is expected that Majorana 1 chip will enable quantum computing.
- II. Majorana 1 chip has been introduced by Amazon Web Services (AWS).
- III. Deep learning is a subset of machine learning.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "C"
explanation = "Majorana 1 is Microsoft's quantum chip, aimed at enabling quantum computing, not an AWS product. Deep learning, which uses multi-layer neural networks, is a subset of machine learning."
trap = "AWS has its own quantum chip announcements around the same time, which makes the wrong attribution plausible."

[[question]]
id = "upsc-2025-048"
topics = ["pre.gs.science-tech.biotech.vaccines-and-biopharmaceuticals", "pre.gs.general-science.health.immunity-and-vaccines"]
source = "UPSC Prelims 2025"
stem = """
With reference to monoclonal antibodies, often mentioned in news, consider the following statements:

- I. They are man-made proteins.
- II. They stimulate immunological function due to their ability to bind to specific antigens.
- III. They are used in treating viral infections like that of Nipah virus.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "D"
explanation = "Monoclonal antibodies are lab-made proteins engineered to bind one specific antigen and so engage the immune response. They are used against some viral infections, and have been used in the response to Nipah virus."
trap = "Antibodies are usually thought of as natural, but monoclonal antibodies are produced in the laboratory."

[[question]]
id = "upsc-2025-049"
topics = ["pre.gs.general-science.biology.microorganisms"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. No virus can survive in ocean waters.
- II. No virus can infect bacteria.
- III. No virus can change the cellular transcriptional activity in host cells.

How many of the statements given above are correct?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "D"
explanation = "Oceans hold huge numbers of viruses. Bacteriophages are viruses that infect bacteria, and many viruses take over a host cell's machinery and change its transcription. All three absolute claims are therefore false."
trap = "The word 'no' in each statement makes it an absolute claim, which one counter-example is enough to break."

[[question]]
id = "upsc-2025-050"
topics = ["pre.gs.environment.pollution.bioremediation", "pre.gs.environment.pollution.water-pollution-and-eutrophication"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Activated carbon is a good and an attractive tool to remove pollutants from effluent streams and to remediate contaminants from various industries.

**Statement II :**

Activated carbon exhibits a large surface area and a strong potential for adsorbing heavy metals.

**Statement III :**

Activated carbon can be easily synthesized from environmental wastes with high carbon content.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "A"
explanation = "Activated carbon adsorbs heavy metals well because of its very large surface area, and it can be made cheaply from carbon-rich waste. Effectiveness and low cost together make it an attractive clean-up tool."
trap = "The 'attractive tool' claim rests on both performance and cost, so one reason alone is incomplete."

[[question]]
id = "upsc-2025-051"
topics = ["pre.gs.polity.union.president.veto-ordinance-and-pardoning-powers"]
source = "UPSC Prelims 2025"
stem = """
With reference to the Indian polity, consider the following statements:

- I. An Ordinance can amend any Central Act.
- II. An Ordinance can abridge a Fundamental Right.
- III. An Ordinance can come into effect from a back date.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "C"
explanation = "An ordinance has the same force as an Act of Parliament, so it can amend a Central Act and can be made to operate retrospectively. Like any law, it cannot take away or abridge a Fundamental Right."
trap = "Ordinances are 'temporary', yet they enjoy the full law-making power of Parliament except where the Constitution bars it."
note = "polity-president-vice-president"

[[question]]
id = "upsc-2025-052"
topics = ["pre.gs.polity.constitution.union-and-its-territory", "pre.gs.indian-geography.location.states-union-territories-and-their"]
source = "UPSC Prelims 2025"
stem = """
Consider the following pairs:

| State | Description |
|---|---|
| I. Arunachal Pradesh | The capital is named after a fort, and the State has two National Parks |
| II. Nagaland | The State came into existence on the basis of a Constitutional Amendment Act |
| III. Tripura | Initially a Part 'C' State, it became a centrally administered territory with the reorganization of States in 1956 and later attained the status of a full-fledged State |

How many of the above pairs are correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Itanagar is named after Ita Fort and Arunachal has Namdapha and Mouling National Parks. Nagaland was created through the 13th Constitutional Amendment, and Tripura was a Part C State, then a Union Territory in 1956, and became a State in 1972."
trap = "Nagaland's statehood by amendment, rather than by an ordinary Parliament Act, is the detail that tempts a wrong 'no'."
note = "polity-union-territory-citizenship"

[[question]]
id = "upsc-2025-053"
topics = ["pre.gs.polity.system.inter-state-relations", "pre.gs.polity.system.centre-state.administrative-relations"]
source = "UPSC Prelims 2025"
stem = """
With reference to India, consider the following:

- I. The Inter-State Council
- II. The National Security Council
- III. Zonal Councils

How many of the above were established as per the provisions of the Constitution of India?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "A"
explanation = "Article 263 of the Constitution provides for the Inter-State Council. Zonal Councils were set up under the States Reorganisation Act, 1956, and the National Security Council was created by an executive decision."
trap = "All three bodies deal with coordination, but only the Inter-State Council has a constitutional basis."
note = "polity-federalism-interstate"

[[question]]
id = "upsc-2025-054"
topics = ["pre.gs.polity.states.governor", "pre.gs.polity.union.president.veto-ordinance-and-pardoning-powers"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. The Constitution of India explicitly mentions that in certain spheres the Governor of a State acts in his/her own discretion.
- II. The President of India can, of his/her own, reserve a bill passed by a State Legislature for his/her consideration without it being forwarded by the Governor of the State concerned.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "A"
explanation = "Provisions such as those for the Sixth Schedule areas in Assam and some other States explicitly say the Governor acts in his or her discretion. A State bill goes to the President only when the Governor reserves it, so the President cannot reserve it on his own."
trap = "The President's overall supremacy over the Governor makes statement II sound right, but the reservation power rests with the Governor."
note = "polity-state-executive"

[[question]]
id = "upsc-2025-055"
topics = ["pre.gs.polity.rights.dpsp", "pre.gs.polity.rights.fundamental-duties", "pre.gs.polity.rights.fundamental-rights"]
source = "UPSC Prelims 2025"
stem = """
Consider the following pairs:

| Provision in the Constitution of India | Stated under |
|---|---|
| I. Separation of Judiciary from the Executive in the public services of the State | The Directive Principles of State Policy |
| II. Valuing and preserving of the rich heritage of our composite culture | The Fundamental Duties |
| III. Prohibition of employment of children below the age of 14 years in factories | The Fundamental Rights |

How many of the above pairs are correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "C"
explanation = "Article 50 directs the State to separate the judiciary from the executive, Article 51A(f) makes preserving the composite culture a duty, and Article 24 bars child labour in factories as part of the right against exploitation."
trap = "Child labour sounds like a welfare directive, but its prohibition in factories is a justiciable Fundamental Right."
note = "polity-dpsp-duties"

[[question]]
id = "upsc-2025-056"
topics = ["pre.gs.polity.special-areas.scheduled-and-tribal-areas"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

With reference to the Constitution of India, if an area in a State is declared as Scheduled Area under the Fifth Schedule

- I. the State Government loses its executive power in such areas and a local body assumes total administration
- II. the Union Government can take over the total administration of such areas under certain circumstances on the recommendations of the Governor

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "D"
explanation = "Fifth Schedule areas stay under the State's executive power, with the Governor given special responsibilities such as regulating land transfer and the Tribes Advisory Council. The Union does not take over administration on the Governor's recommendation, and no local body assumes total control."
trap = "The Fifth and Sixth Schedules are easily mixed up; autonomous district councils belong to the Sixth Schedule."

[[question]]
id = "upsc-2025-057"
topics = ["pre.gs.economy.industry.industrial-policy-and-msmes"]
source = "UPSC Prelims 2025"
stem = """
With reference to India, consider the following pairs:

| Organization | Union Ministry |
|---|---|
| I. The National Automotive Board | Ministry of Commerce and Industry |
| II. The Coir Board | Ministry of Heavy Industries |
| III. The National Centre for Trade Information | Ministry of Micro, Small and Medium Enterprises |

How many of the above pairs are correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "D"
explanation = "The National Automotive Board is under the Ministry of Heavy Industries, the Coir Board under the Ministry of Micro, Small and Medium Enterprises, and the National Centre for Trade Information under the Ministry of Commerce and Industry. Every pair swaps the ministry."
trap = "Each ministry is plausible for its neighbouring board, so the pairs look right at a glance."

[[question]]
id = "upsc-2025-058"
topics = ["pre.gs.polity.amendment.procedure-for-amendment", "pre.gs.polity.states.governor"]
source = "UPSC Prelims 2025"
stem = """
Consider the following subjects under the Constitution of India:

- I. List I-Union List, in the Seventh Schedule
- II. Extent of the executive power of a State
- III. Conditions of the Governor's office

For a constitutional amendment with respect to which of the above, ratification by the Legislatures of not less than one-half of the States is required before presenting the bill to the President of India for assent?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "A"
explanation = "Amendments touching the legislative lists of the Seventh Schedule and the extent of the executive power of the States need ratification by at least half of the State legislatures. The conditions of the Governor's office can be amended by a special majority of Parliament alone."
