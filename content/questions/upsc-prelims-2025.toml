source = "UPSC Prelims 2025"
stem = """
GPS-Aided Geo Augmented Navigation (GAGAN) uses a system of ground stations to provide necessary augmentation. Which of the following statements is/are correct in respect of GAGAN?

- I. It is designed to provide additional accuracy and integrity.
- II. It will allow more uniform and high quality air traffic management.
- III. It will provide benefits only in aviation but not in other modes of transportation.

Select the correct answer using the code given below."""
options = ["I, II and III", "II and III only", "I only", "I and II only"]
answer = "D"
explanation = "GAGAN augments GPS signals with ground stations and geostationary satellites to give extra accuracy and integrity, which supports better air traffic management. It is not limited to aviation and is also usable in other modes such as railways and maritime transport."
trap = "GAGAN was built for civil aviation, which makes the 'only in aviation' claim seem plausible."

