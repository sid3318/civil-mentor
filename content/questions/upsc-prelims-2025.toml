# UPSC Civil Services (Preliminary) Examination 2025, General Studies Paper I, Series A.
#
# The question paper and the answer key are transcribed from the two documents UPSC published on upsc.gov.in:
#   question paper: https://www.upsc.gov.in/sites/default/files/QP-CSP-25-GENERAL-STUDIES-PAPER-I-26052025.pdf
#   answer key:     https://www.upsc.gov.in/sites/default/files/AnsKeyCivilServicesP-Exam-2025-GeneralStudies-I-130526.pdf
#                   (key published 13 May 2026, after the 2025 exam cycle; Series A page: 100 questions, none dropped)
# Question numbers are the numbers in the Series A booklet. Stems and options follow the printed English text.
# Statement items keep UPSC's Roman numerals and are written as list items so each one shows on its own line.
# The explanations and traps were written for Civil Mentor and are not UPSC text.

[[question]]
id = "upsc-2025-001"
topics = ["pre.gs.economy.markets.mutual-funds-bonds-and-derivatives"]
source = "UPSC Prelims 2025"
stem = """
With reference to investments, consider the following:

- I. Bonds
- II. Hedge Funds
- III. Stocks
- IV. Venture Capital

How many of the above are treated as Alternative Investment Funds?"""
options = ["Only one", "Only two", "Only three", "All the four"]
answer = "B"
explanation = "SEBI's Alternative Investment Funds framework covers privately pooled vehicles such as venture capital funds, hedge funds and private equity funds. Bonds and stocks are ordinary securities, not AIFs, so only two of the four qualify."
trap = "Bonds and stocks are 'investments', but 'alternative' means privately pooled funds outside the mainstream listed securities."

[[question]]
id = "upsc-2025-002"
topics = ["pre.gs.economy.money.reserve-bank-of-india"]
source = "UPSC Prelims 2025"
stem = """
Which of the following are the sources of income for the Reserve Bank of India?

- I. Buying and selling Government bonds
- II. Buying and selling foreign currency
- III. Pension fund management
- IV. Lending to private companies
- V. Printing and distributing currency notes

Select the correct answer using the code given below."""
options = ["I and II only", "II, III and IV", "I, III, IV and V", "I, II and V"]
answer = "A"
explanation = "The RBI earns mainly from interest on the government securities it holds and from its foreign-exchange operations. It does not run pension funds, it lends to banks and the government rather than to private companies, and printing notes is a cost it bears."
trap = "Printing currency sounds like the RBI's main earner, but note issue is a liability and a production cost, not income."

[[question]]
id = "upsc-2025-003"
topics = ["pre.gs.economy.fiscal.taxation"]
source = "UPSC Prelims 2025"
stem = """
With reference to the Government of India, consider the following information:

| Organization | Some of its functions | It works under |
|---|---|---|
| I. Directorate of Enforcement | Enforcement of the Fugitive Economic Offenders Act, 2018 | Internal Security Division-I, Ministry of Home Affairs |
| II. Directorate of Revenue Intelligence | Enforces the Provisions of the Customs Act, 1962 | Department of Revenue, Ministry of Finance |
| III. Directorate General of Systems and Data Management | Carrying out big data analytics to assist tax officers for better policy and nabbing tax evaders | Department of Revenue, Ministry of Finance |

In how many of the above rows is the information correctly matched?"""
options = ["Only one", "Only two", "All the three", "None"]
answer = "A"
explanation = "Row I fails because the Directorate of Enforcement works under the Department of Revenue in the Finance Ministry, not under the Home Ministry's Internal Security Division. UPSC's final key counts exactly one row as correctly matched."
trap = "The Fugitive Economic Offenders Act sounds like a security matter, which tempts one to place the Enforcement Directorate under the Home Ministry."

[[question]]
id = "upsc-2025-004"
topics = ["pre.gs.economy.markets.sebi-and-market-regulation"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. The Reserve Bank of India mandates all the listed companies in India to submit a Business Responsibility and Sustainability Report (BRSR).
- II. In India, a company submitting a BRSR makes disclosures in the report that are largely non-financial in nature.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "B"
explanation = "The BRSR requirement comes from the securities market regulator SEBI, not the RBI, so statement I is wrong. The report covers environmental, social and governance disclosures that are largely non-financial, so statement II is right."
trap = "Because it is a mandatory corporate disclosure, it is easy to credit it to the RBI instead of SEBI."

[[question]]
id = "upsc-2025-005"
topics = ["pre.gs.economy.fiscal.taxation.direct-taxes"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

In India, income from allied agricultural activities like poultry farming and wool rearing in rural areas is exempted from any tax.

**Statement II :**

In India, rural agricultural land is not considered a capital asset under the provisions of the Income-tax Act, 1961.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement I and Statement II are correct and Statement II explains Statement I", "Both Statement I and Statement II are correct but Statement II does not explain Statement I", "Statement I is correct but Statement II is not correct", "Statement I is not correct but Statement II is correct"]
answer = "D"
explanation = "Only agricultural income in the strict sense is exempt; income from poultry farming or wool rearing is not agricultural income and is taxable. Rural agricultural land is excluded from the definition of capital asset, so Statement II is correct."
trap = "'Allied' activities feel like part of agriculture, but the exemption is limited to income from the land itself."

[[question]]
id = "upsc-2025-006"
topics = ["pre.gs.indian-geography.resources.metallic-and-non-metallic-minerals"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. India has joined the Minerals Security Partnership as a member.
- II. India is a resource-rich country in all the 30 critical minerals that it has identified.
- III. The Parliament in 2023 has amended the Mines and Minerals (Development and Regulation) Act, 1957 empowering the Central Government to exclusively auction mining lease and composite license for certain critical minerals.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "C"
explanation = "India became a member of the Minerals Security Partnership in 2023, and the 2023 amendment to the MMDR Act lets the Centre auction mining leases and composite licences for specified critical minerals. India is import-dependent for many of its 30 critical minerals, so statement II is wrong."
trap = "The word 'all' in statement II is the giveaway: India has deposits of some critical minerals but depends on imports for many others."

[[question]]
id = "upsc-2025-007"
topics = ["pre.gs.economy.markets.mutual-funds-bonds-and-derivatives", "pre.gs.economy.markets.capital-market"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

As regards returns from an investment in a company, generally, bondholders are considered to be relatively at lower risk than stockholders.

**Statement II :**

Bondholders are lenders to a company whereas stockholders are its owners.

**Statement III :**

For repayment purpose, bondholders are prioritized over stockholders by a company.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement I and Statement II are correct and Statement I explains Statement II", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "A"
explanation = "Bondholders are creditors and are repaid before shareholders, who are owners and take the residual. Both facts together explain why bonds carry lower risk than stocks."
trap = "Option B reverses the logic: the risk difference is the conclusion explained by statements II and III, not their cause."

[[question]]
id = "upsc-2025-008"
topics = ["pre.gs.economy.markets.capital-market", "pre.gs.economy.markets.sebi-and-market-regulation"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. India accounts for a very large portion of all equity option contracts traded globally thus exhibiting a great boom.
- II. India's stock market has grown rapidly in the recent past even overtaking Hong Kong's at some point of time.
- III. There is no regulatory body either to warn the small investors about the risks of options trading or to act on unregistered financial advisors in this regard.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "A"
explanation = "India's equity options volumes are among the largest in the world and its market capitalisation briefly overtook Hong Kong's. SEBI regulates options trading and acts against unregistered advisors, so statement III is wrong."
trap = "Statement III sounds like a plausible regulatory gap, but SEBI is exactly the body that warns investors and pursues unregistered advisers."

[[question]]
id = "upsc-2025-009"
topics = ["pre.gs.economy.sustainable.green-growth-and-the-circular"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

**Statement I :**

Circular economy reduces the emissions of greenhouse gases.

**Statement II :**

Circular economy reduces the use of raw materials as inputs.

**Statement III :**

Circular economy reduces wastage in the production process.

Which one of the following is correct in respect of the above statements?"""
options = ["Both Statement II and Statement III are correct and both of them explain Statement I", "Both Statement II and Statement III are correct but only one of them explains Statement I", "Only one of the Statements II and III is correct and that explains Statement I", "Neither Statement II nor Statement III is correct"]
answer = "A"
explanation = "A circular economy reuses and recycles materials, which cuts virgin raw-material use and production waste. Less extraction, processing and waste handling means lower greenhouse-gas emissions, so both II and III explain I."
trap = "It is tempting to treat only one of the two mechanisms as the real cause, but both reduce the energy-intensive steps behind emissions."

[[question]]
id = "upsc-2025-010"
topics = ["pre.gs.economy.fiscal.union-budget"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements:

- I. Capital receipts create a liability or cause a reduction in the assets of the Government.
- II. Borrowings and disinvestment are capital receipts.
- III. Interest received on loans creates a liability of the Government.

Which of the statements given above are correct?"""
options = ["I and II only", "II and III only", "I and III only", "I, II and III"]
answer = "A"
explanation = "Borrowings add to liabilities and disinvestment reduces government assets, so both are capital receipts. Interest received on loans is a revenue receipt and creates no liability, which makes statement III wrong."
trap = "Receiving money does not always mean a liability: interest income is revenue, while loan principal recovered is the capital item."

[[question]]
id = "upsc-2025-011"
topics = ["pre.gs.modern.reforms.raja-rammohan-roy"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements about Raja Ram Mohan Roy:

- I. He possessed great love and respect for the traditional philosophical systems of the East.
- II. He desired his countrymen to accept the rational and scientific approach and the principle of human dignity and social equality of all men and women."""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "C"
explanation = "Roy drew on Vedanta and Upanishadic thought while urging Indians to adopt reason, science and equality, including for women. His reform combined respect for Eastern philosophy with modern rational ideas."
trap = "Assuming a modernising reformer must have rejected tradition leads to dropping statement I."

[[question]]
id = "upsc-2025-012"
topics = ["pre.gs.modern.gandhian.khilafat-and-non-cooperation-movements"]
source = "UPSC Prelims 2025"
stem = """
Consider the following subjects with regard to Non-Cooperation Programme:

- I. Boycott of law-courts and foreign cloth
- II. Observance of strict non-violence
- III. Retention of titles and honours without using them in public
- IV. Establishment of Panchayats for settling disputes

How many of the above were parts of Non-Cooperation Programme?"""
options = ["Only one", "Only two", "Only three", "All the four"]
answer = "C"
explanation = "The programme called for boycott of courts and foreign cloth, strict non-violence and private panchayats to settle disputes. It asked people to surrender titles and honours, not to keep them quietly."
trap = "The wording of item III sounds like a compromise, but the Congress demanded giving titles up, not merely not using them."

[[question]]
id = "upsc-2025-013"
topics = ["pre.gs.medieval.culture.technology"]
source = "UPSC Prelims 2025"
stem = """
The irrigation device called 'Araghatta' was"""
options = ["a water bag made of leather pulled over a pulley", "a large wheel with earthen pots tied to the outer ends of its spokes", "a larger earthen pot driven by bullocks", "a large water bucket pulled up by rope directly by hand"]
answer = "B"
explanation = "The araghatta, also called the Persian wheel or rahat, was a wheel carrying a series of earthen pots that dipped into a well or channel and emptied as the wheel turned. The leather-bag-and-pulley device is a different lift, the charsa."
trap = "Leather bags on a pulley were also a common lift in medieval India, but that was the charsa, not the araghatta."

[[question]]
id = "upsc-2025-014"
topics = ["pre.gs.ancient.post-gupta.pallavas-of-kanchi"]
source = "UPSC Prelims 2025"
stem = """
Who among the following rulers in ancient India had assumed the titles 'Mattavilasa', 'Vichitrachitta' and 'Gunabhara'?"""
options = ["Mahendravarman I", "Simhavishnu", "Narasimhavarman I", "Simhavarman"]
answer = "A"
explanation = "The Pallava king Mahendravarman I took these titles and wrote the Sanskrit farce Mattavilasa Prahasana. He was a patron of art and introduced rock-cut temples in the Tamil country."
trap = "Narasimhavarman I is the better-known Pallava, but the titles belong to his father."

[[question]]
id = "upsc-2025-015"
topics = ["pre.gs.ancient.guptas.rulers-from-chandragupta-i", "pre.gs.ancient.post-gupta.accounts-of-fa-hien"]
source = "UPSC Prelims 2025"
stem = """
Fa-hien (Faxian), the Chinese pilgrim, travelled to India during the reign of"""
options = ["Samudragupta", "Chandragupta II", "Kumaragupta I", "Skandagupta"]
answer = "B"
explanation = "Fa-hien visited India in the early fifth century, around 399 to 414 CE, during the reign of Chandragupta II (Vikramaditya). His account of Gupta India describes a prosperous and peaceful empire."
trap = "Samudragupta is the most famous Gupta ruler, but he preceded Fa-hien's visit."

[[question]]
id = "upsc-2025-016"
topics = ["pre.gs.medieval.early.cholas"]
source = "UPSC Prelims 2025"
stem = """
Who among the following led a successful military campaign against the kingdom of Srivijaya, the powerful maritime State, which ruled the Malay Peninsula, Sumatra, Java and the neighbouring islands?"""
options = ["Amoghavarsha (Rashtrakuta)", "Prataparudra (Kakatiya)", "Rajendra I (Chola)", "Vishnuvardhana (Hoysala)"]
answer = "C"
explanation = "Rajendra I sent a naval expedition to Kadaram (Kedah) of the Srivijaya empire around 1025 CE. It is the best-known overseas campaign of any Indian dynasty."
trap = "Several southern dynasties were powerful, but only the Cholas built a navy capable of crossing the Bay of Bengal."

[[question]]
id = "upsc-2025-017"
topics = ["pre.gs.ancient.mahajanapadas.sixteen-mahajanapadas"]
source = "UPSC Prelims 2025"
stem = """
With reference to ancient India (600–322 BC), consider the following pairs:

| Territorial region | River flowing in the region |
|---|---|
| I. Asmaka | Godavari |
| II. Kamboja | Vipas |
| III. Avanti | Mahanadi |
| IV. Kosala | Sarayu |

How many of the pairs given above are correctly matched?"""
options = ["Only one", "Only two", "Only three", "All the four"]
answer = "B"
explanation = "Asmaka lay on the Godavari and Kosala on the Sarayu. Kamboja was in the north-west, far from the Vipas (Beas), and Avanti in Malwa, not on the Mahanadi."
trap = "Avanti and Kamboja are both mahajanapadas, so the pairs feel familiar, but their rivers do not match."

[[question]]
id = "upsc-2025-018"
topics = ["pre.gs.culture.music.hindustani-classical-music"]
source = "UPSC Prelims 2025"
stem = """
The first Gandharva Mahavidyalaya, a music training school, was set up in 1901 by Vishnu Digambar Paluskar in"""
options = ["Delhi", "Gwalior", "Ujjain", "Lahore"]
answer = "D"
explanation = "Paluskar founded the Gandharva Mahavidyalaya at Lahore in 1901 to teach Hindustani classical music outside the royal courts. A Bombay branch followed in 1908."
trap = "Gwalior is the famous gharana city, but the first school was in Lahore."

[[question]]
id = "upsc-2025-019"
topics = ["pre.gs.ancient.mauryas.administration-economy-and-society"]
source = "UPSC Prelims 2025"
stem = """
Ashokan inscriptions suggest that the 'Pradeshika', 'Rajuka' and 'Yukta' were important officers at the"""
options = ["village-level administration", "district-level administration", "provincial administration", "level of the central administration"]
answer = "B"
explanation = "Ashoka's edicts name these three as officers of the districts, who toured their areas and carried out the king's orders. The provinces were governed by princes (kumaras) and the village by its own headman."
trap = "Because these officers are named in royal edicts, it is tempting to place them at the centre or in the provinces."

[[question]]
id = "upsc-2025-020"
topics = ["pre.gs.modern.gandhian.khilafat-and-non-cooperation-movements"]
source = "UPSC Prelims 2025"
stem = """
Consider the following statements in respect of the Non-Cooperation Movement:

- I. The Congress declared the attainment of 'Swaraj' by all legitimate and peaceful means be its objective.
- II. It was to be implemented in stages with civil disobedience and non-payment of taxes for the next stage only if 'Swaraj' did not come within a year and the Government resorted to repression.

Which of the statements given above is/are correct?"""
options = ["I only", "II only", "Both I and II", "Neither I nor II"]
answer = "C"
explanation = "At Nagpur in December 1920 the Congress adopted attainment of Swaraj by legitimate and peaceful means as its goal. The movement was planned in stages, with civil disobedience and tax refusal held back as a later step."
trap = "Civil disobedience and tax refusal are linked with Gandhi, so one assumes they began the movement rather than being a reserve stage."

[[question]]
id = "upsc-2025-021"
topics = ["pre.gs.world-geography.regions.europe", "pre.gs.current.international.summits-and-groupings"]
source = "UPSC Prelims 2025"
stem = """
Consider the following countries:

- I. Austria
- II. Bulgaria
- III. Croatia
- IV. Serbia
- V. Sweden
- VI. North Macedonia

How many of the above are members of the North Atlantic Treaty Organization?"""
options = ["Only three", "Only four", "Only five", "All the six"]
answer = "B"
explanation = "Bulgaria, Croatia, North Macedonia and Sweden are NATO members; Sweden joined in 2024. Austria and Serbia are militarily neutral or non-aligned and are not members."
trap = "Sweden's accession is recent, so it is easy to leave it out and answer three."

[[question]]
id = "upsc-2025-022"
topics = ["pre.gs.world-geography.regions.south-america", "pre.gs.world-geography.features.mountain-ranges-and-plateaus"]
source = "UPSC Prelims 2025"
stem = """
Consider the following countries:

- I. Bolivia
- II. Brazil
- III. Colombia
- IV. Ecuador
- V. Paraguay
- VI. Venezuela

Andes mountains pass through how many of the above countries?"""
options = ["Only two", "Only three", "Only four", "Only five"]
answer = "C"
explanation = "The Andes run through Bolivia, Colombia, Ecuador and Venezuela among the countries listed. Brazil and Paraguay lie east of the range."
